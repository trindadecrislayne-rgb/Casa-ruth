}
.badge img{width:100%;height:100%;object-fit:cover;display:block;}
.eyebrow{
  letter-spacing:0.22em; font-size:0.68rem; color:var(--gold); margin-bottom:0.1rem;
  display:flex; align-items:center; justify-content:center; gap:10px; text-transform:uppercase;
}
.eyebrow::before, .eyebrow::after{content:""; height:1px; width:26px; background:var(--gold); opacity:.8;}
h1{
  font-family:'Playfair Display',serif; font-style:italic; font-weight:800; font-size:2rem; margin:0; line-height:1.05;
  color:var(--wine-deep);
}
.since{font-style:italic; color:var(--gold); font-size:0.85rem; margin-top:0.1rem;}
main{max-width:720px; margin:0 auto; padding:1.3rem 1rem 3rem;}
.recipe{
  background:color-mix(in srgb, var(--card) 96%, transparent); border-radius:var(--radius); padding:1.5rem 1.5rem 1.7rem;
  margin-bottom:1.1rem; border:1px solid rgba(176,141,87,.45); box-shadow:var(--shadow);
}
.recipe h2{
  font-family:'Playfair Display',serif; font-weight:700; margin:0 0 0.2rem; font-size:1.4rem; color:var(--wine);
}
.recipe .sub{font-size:0.88rem; opacity:0.75; margin-bottom:1rem;}
/* ---- Cartões no lugar de planilhas: cada linha vira um cartão ---- */
table{display:block; width:100%; font-size:0.95rem;}
table thead{display:none;}
table tbody{
  display:grid; width:100%; gap:0.7rem;
  grid-template-columns:repeat(auto-fill, minmax(min(100%, 235px), 1fr));
}
table tr{
  display:flex; flex-direction:column; gap:0.45rem; min-width:0;
  padding:0.8rem 0.95rem; border-radius:16px;
  border:1px solid rgba(176,141,87,.4);
  background:color-mix(in srgb, var(--cream-2) 55%, var(--card));
  box-shadow:0 1px 2px rgba(78,20,32,.05), 0 10px 20px -14px rgba(78,20,32,.25);
}
table td{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:0.2rem 0.6rem;
  padding:0; border:none; width:auto; min-width:0; text-align:right;
}
table td:first-child{
  justify-content:flex-start; text-align:left;
  font-family:'Playfair Display',serif; font-weight:700; color:var(--wine); font-size:1rem;
}
table td[data-label]::before{
  content:attr(data-label); flex:0 0 auto; text-align:left;
  font-size:0.66rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--gold); font-weight:700;
}
table td[data-label] > .cv{margin-left:auto; text-align:right;}
table td.acao{justify-content:flex-end;}
table tr[data-cols="2"]{flex-direction:row; align-items:center; justify-content:space-between; gap:0.8rem;}
table tr[data-cols="2"] td:first-child{flex:1 1 auto;}
table tr.vazio{grid-column:1/-1; background:transparent; border-style:dashed; box-shadow:none; opacity:0.75;}
table tr.vazio td{font-family:inherit; font-weight:400; color:var(--ink); font-size:0.9rem;}
th.qty, th.price{text-align:right;}

/* Tabela de verdade: para comparar os mesmos números em várias linhas (preço, margem, saldo).
   Registros e listas com botão continuam virando cartões. */
table.tabela-real{display:table; border-collapse:collapse;}
table.tabela-real thead{display:table-header-group;}
table.tabela-real tbody{display:table-row-group;}
table.tabela-real tr{display:table-row; padding:0; border:none; border-radius:0; background:none; box-shadow:none;}
table.tabela-real th{padding:0.3rem 0.4rem; font-size:0.68rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--gold); text-align:left; border-bottom:1px solid rgba(176,141,87,.5);}
table.tabela-real th.qty, table.tabela-real th.price{text-align:right;}
table.tabela-real td{display:table-cell; padding:0.5rem 0.4rem; text-align:right; vertical-align:middle; font-size:0.88rem; border-bottom:1px solid rgba(176,141,87,.25);}
table.tabela-real td:first-child{text-align:left; font-family:inherit; font-weight:600; font-size:0.9rem; color:var(--ink);}
table.tabela-real td[data-label]::before{content:none;}
table.tabela-real tr:last-child td{border-bottom:none;}
.aviso-combo{
  display:flex; flex-direction:column; gap:0.5rem; padding:0.8rem 0.95rem; border-radius:16px;
  border:1px dashed var(--gold); font-size:0.9rem;
}
.aviso-combo button{
  align-self:flex-start; border:1px solid var(--wine); background:var(--wine); color:var(--cream);
  border-radius:999px; padding:0.4rem 0.9rem; cursor:pointer; font-family:inherit;
}
input.price-input{
  width:60px; text-align:right; padding:0.3rem 0.4rem; border-radius:10px;
  border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;
}
input.pkg-input[data-field="tam"]{width:52px; margin-right:0.3rem;}
input.pkg-input[data-field="preco"]{width:60px;}
.unit-hint{font-size:0.8rem; opacity:0.6; margin-left:0.15rem;}
.summary{
  display:flex; justify-content:space-between; margin-top:1rem; padding-top:0.9rem;
  border-top:2px solid var(--wine); font-weight:600; flex-wrap:wrap; gap:0.5rem;
}
.summary div{min-width:110px;}
.summary .label{font-size:0.72rem; opacity:0.65; display:block; letter-spacing:.03em;}
.summary .value{font-family:'Playfair Display',serif; font-size:1.15rem; color:var(--wine);}
footer{text-align:center; font-size:0.8rem; opacity:0.6; padding:1rem;}
/* ---- Dock flutuante (menu) — não empurra o conteúdo, flutua por cima ---- */
nav.tabs{
  position:fixed; z-index:70;
  display:flex; gap:0.2rem;
  background:color-mix(in srgb, var(--card) 94%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(176,141,87,.5); box-shadow:var(--shadow);
  border-radius:20px; padding:0.4rem; overflow:auto; max-height:80vh;
  transition:all .2s ease;
}
nav.tabs::-webkit-scrollbar{display:none;}

/* posição: embaixo ou em cima (horizontal) */
nav.tabs.pos-bottom, nav.tabs.pos-top{
  flex-direction:row; align-items:center; left:50%; max-width:94vw; max-height:70px;
}
nav.tabs.pos-bottom{ bottom:calc(14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); }
nav.tabs.pos-top{ top:calc(14px + env(safe-area-inset-top,0px)); transform:translateX(-50%); }
/* posição: lateral (vertical) */
nav.tabs.pos-left, nav.tabs.pos-right{
  flex-direction:column; align-items:stretch; top:50%; transform:translateY(-50%); max-height:80vh; width:62px;
}
nav.tabs.pos-left{ left:10px; }
nav.tabs.pos-right{ right:10px; }
nav.tabs.pos-left.expanded, nav.tabs.pos-right.expanded{ width:178px; }

nav.tabs button{
  font-family:inherit; font-size:0.78rem; padding:0.5rem 0.55rem; border-radius:14px;
  border:1px solid transparent; background:transparent; color:var(--wine); cursor:pointer;
  display:flex; white-space:nowrap; overflow:hidden; flex:0 0 auto;
}
nav.tabs button .icon{font-size:1.15rem; line-height:1;}
nav.tabs button .icon svg, #sidebar-handle svg, #sidebar-toggle svg{display:block;}
#sidebar-handle, #sidebar-toggle{display:flex; align-items:center; justify-content:center;}
nav.tabs button .label{font-size:0.68rem; line-height:1;}
nav.tabs button.active{background:var(--wine-deep); border-color:var(--wine-deep); color:var(--cream); box-shadow:0 4px 12px -4px rgba(78,20,32,.6);}

/* em cima/embaixo: ícone em cima, nome embaixo */
nav.tabs.pos-bottom button, nav.tabs.pos-top button{flex-direction:column; align-items:center; gap:0.1rem;}
/* lateral: ícone do lado, nome ao lado (depois) */
nav.tabs.pos-left button, nav.tabs.pos-right button{flex-direction:row; align-items:center; gap:0.55rem;}

/* recolhido: só ícone, sem nome */
nav.tabs:not(.expanded) button .label{display:none;}
nav.tabs:not(.expanded).pos-bottom button, nav.tabs:not(.expanded).pos-top button{padding:0.5rem;}
nav.tabs:not(.expanded).pos-left button, nav.tabs:not(.expanded).pos-right button{padding:0.5rem; justify-content:center;}

#sidebar-handle{
  cursor:grab; text-align:center; padding:0.4rem 0.5rem; color:var(--gold); font-size:0.95rem;
  flex:0 0 auto; align-self:center; border:none; background:transparent; font-family:inherit; border-radius:14px;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
/* posição livre: o Dock vai exatamente onde você soltar */
nav.tabs.free{
  left:var(--dx,10px) !important; top:var(--dy,10px) !important;
  right:auto !important; bottom:auto !important; transform:none !important;
}
nav.tabs.free.pos-top, nav.tabs.free.pos-bottom{width:max-content;}
nav.tabs.dragging{transition:none !important; cursor:grabbing; box-shadow:0 18px 40px -10px rgba(78,20,32,.45);}
nav.tabs.dragging #sidebar-handle{cursor:grabbing;}
#sidebar-toggle{
  font-family:inherit; border:none; background:transparent; color:var(--wine);
  border-radius:14px; padding:0.4rem 0.5rem; cursor:pointer; font-size:0.95rem; flex:0 0 auto;
}

.subnav{display:flex; gap:0.4rem; flex-wrap:wrap; margin:0 0 1rem;}
.subnav:empty{display:none;}
.subnav button{font-family:inherit; font-size:0.85rem; padding:0.45rem 0.95rem; border-radius:999px; border:1px solid var(--gold); background:transparent; color:var(--wine); cursor:pointer;}
.subnav button.active{background:var(--wine-deep); border-color:var(--wine-deep); color:var(--cream);}
.view{display:none;}
.view.active{display:block;}
.stock-input{
  width:80px; text-align:right; padding:0.3rem 0.45rem; border-radius:10px;
  border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;
}
.gargalo{color:var(--wine); font-size:0.8rem;}
button{border-radius:999px;}
input[type="text"], input[type="number"], input[type="date"], select, textarea{
  border-radius:12px;
}
/* ---- Contas do mês ---- */
.contas-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 235px), 1fr)); gap:0.7rem;}
.conta-card{
  display:flex; flex-direction:column; gap:0.5rem; min-width:0; padding:0.8rem 0.95rem; border-radius:16px;
  border:1px solid rgba(176,141,87,.4);
  background:color-mix(in srgb, var(--cream-2) 55%, var(--card));
  box-shadow:0 1px 2px rgba(78,20,32,.05), 0 10px 20px -14px rgba(78,20,32,.25);
}
.conta-card.paga{opacity:0.75;}
.conta-topo{display:flex; justify-content:space-between; align-items:flex-start; gap:0.5rem;}
.conta-nome{font-family:'Playfair Display',serif; font-weight:700; color:var(--wine); font-size:1rem;}
.selo{font-size:0.62rem; letter-spacing:0.04em; text-transform:uppercase; font-weight:700; padding:0.18rem 0.5rem; border-radius:999px; white-space:nowrap;}
.selo-ok{background:#3F7D4F; color:#fff;}
.selo-pend{border:1px solid var(--gold); color:var(--gold);}
.selo-hoje{background:var(--gold); color:#2B1B14;}
.selo-atraso{background:var(--wine); color:var(--cream);}
.conta-linha{display:flex; justify-content:space-between; align-items:center; gap:0.6rem; font-size:0.9rem;}
.conta-linha label{font-size:0.66rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--gold); font-weight:700;}
.cfg-mini{
  width:84px; text-align:right; padding:0.3rem 0.45rem; border-radius:10px;
  border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;
}
.cfg-mini:disabled{opacity:0.6;}
.conta-caixa-op{display:flex; align-items:center; gap:0.4rem; font-size:0.8rem; opacity:0.85;}
.conta-acoes{display:flex; gap:0.5rem; flex-wrap:wrap;}
.btn-pri, .btn-sec{border-radius:999px; padding:0.45rem 0.9rem; cursor:pointer; font-family:inherit; font-size:0.85rem;}
.btn-pri{border:1px solid var(--wine); background:var(--wine); color:var(--cream);}
.btn-sec{border:1px solid var(--wine); background:transparent; color:var(--wine);}
.barra{height:8px; border-radius:999px; background:rgba(176,141,87,.25); overflow:hidden; margin-top:0.7rem;}
.barra > i{display:block; height:100%; background:#3F7D4F; transition:width .3s ease;}
.mes-nav{display:flex; align-items:center; justify-content:space-between; gap:0.6rem; margin-bottom:0.9rem;}
.mes-nav .titulo{font-family:'Playfair Display',serif; font-weight:700; font-size:1.15rem; color:var(--wine); text-transform:capitalize; text-align:center; flex:1;}
.campo-contas{padding:0.5rem 0.6rem; border-radius:12px; border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;}

/* ---- Estoque de embalagens: cartões menores ---- */
table.tabela-compacta tbody{grid-template-columns:repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap:0.5rem;}
table.tabela-compacta tr{position:relative; padding:0.55rem 0.7rem; gap:0.15rem; border-radius:12px;}
table.tabela-compacta td{font-size:0.82rem;}
table.tabela-compacta td:first-child{font-size:0.9rem; padding-right:1.7rem;}
table.tabela-compacta td[data-label]::before{font-size:0.58rem;}
table.tabela-compacta td.acao{position:absolute; top:0.4rem; right:0.45rem;}

/* ===== Login (Supabase Auth) ===== */
#auth{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center;padding:1rem;background:var(--cream);overflow:auto;}
#auth.on{display:flex;}
.auth-card{width:100%;max-width:380px;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:1.6rem 1.4rem;border:1px solid var(--gold-soft);color:var(--ink);}
.auth-card h2{font-family:'Playfair Display',serif;margin:0 0 .2rem;font-size:1.7rem;color:var(--wine);text-align:center;}
.auth-card .sub{text-align:center;font-size:.92rem;opacity:.75;margin-bottom:1rem;}
.auth-tabs{display:flex;gap:.4rem;margin-bottom:.6rem;}
.auth-tabs button{flex:1;padding:.55rem;border-radius:12px;border:1px solid var(--gold);background:transparent;color:var(--ink);font:inherit;cursor:pointer;}
.auth-tabs button.on{background:var(--wine);color:var(--cream);border-color:var(--wine);}
.auth-card label{display:block;font-size:.82rem;margin:.7rem 0 .25rem;opacity:.85;}
.auth-card input{width:100%;padding:.7rem .8rem;border-radius:12px;border:1px solid var(--gold);background:var(--cream);color:var(--ink);font:inherit;font-size:1rem;}
.auth-card .go{width:100%;margin-top:1.1rem;padding:.8rem;border:0;border-radius:14px;background:var(--wine);color:var(--cream);font:inherit;font-weight:600;font-size:1rem;cursor:pointer;}
.auth-card .go[disabled]{opacity:.6;cursor:wait;}
.auth-link{background:none;border:0;color:var(--wine);text-decoration:underline;font:inherit;font-size:.88rem;cursor:pointer;margin-top:.8rem;display:block;width:100%;text-align:center;}
#auth-msg{margin-top:.9rem;font-size:.88rem;min-height:1.2em;text-align:center;}
#auth-msg.erro{color:var(--wine);font-weight:600;}
#sync-status{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;z-index:60;padding:.4rem .8rem;border-radius:999px;border:1px solid var(--gold);background:var(--card);color:var(--ink);font:inherit;font-size:.78rem;cursor:default;box-shadow:var(--shadow);}
#sync-status.ok .ico{color:#3a8f4d;font-weight:700;}
@keyframes giro{to{transform:rotate(360deg)}}
#sync-status .giro{display:inline-block;animation:giro 1s linear infinite;}
@media (prefers-reduced-motion:reduce){#sync-status .giro{animation:none}}
#sync-status.erro{border-color:var(--wine);color:var(--wine);font-weight:700;cursor:pointer;}
#btn-sair{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:60;padding:.4rem .8rem;border-radius:999px;border:1px solid var(--gold);background:var(--card);color:var(--ink);font:inherit;font-size:.82rem;cursor:pointer;box-shadow:var(--shadow);}
</style>
</head>
<body>

  <form class="auth-card" id="auth-form" autocomplete="on">
    <h2>Casa Ruth</h2>
    <div class="sub" id="auth-sub">Entre para acessar suas receitas</div>
    <div class="auth-tabs" id="auth-tabs">

<script>
let dbRef = null;
let syncTimer = null;
let margemDesejada = 50;

const massaBase = [
  {n:"Manteiga", g:70, unidade:"kg", tamTipico:500},
  {n:"Farinha de trigo", g:200, unidade:"kg", tamTipico:1000},
  {n:"Ovo", g:50, unidade:"un", qtd:1},
  {n:"Bicarbonato de sódio", g:2.5, unidade:"kg", tamTipico:100},
  {n:"Chocolate em gota", g:150, unidade:"kg", tamTipico:1000},
  {n:"Açúcar refinado", g:80, unidade:"kg", tamTipico:1000},
  {n:"Açúcar mascavo", g:60, unidade:"kg", tamTipico:1000},
];
const PESO_MASSA_POR_COOKIE = 51;
const RENDIMENTO_PADRAO = Math.round(massaBase.reduce((s,i)=>s+i.g,0) / PESO_MASSA_POR_COOKIE); // 12
const RENDIMENTO_KEY = "casaruth_rendimento_fornada";
function loadRendimento(){
  try{
    const v = parseFloat(localStorage.getItem(RENDIMENTO_KEY));
    return (!isNaN(v) && v > 0) ? v : RENDIMENTO_PADRAO;
  }catch(e){ return RENDIMENTO_PADRAO; }
}
function saveRendimento(v){ try{ localStorage.setItem(RENDIMENTO_KEY, String(v)); }catch(e){} marcarAlterado(); }
let RENDIMENTO_FORNADA = loadRendimento();

const sabores = [
  { id:"choco", nome:"Choco Ruth", recheio: [] },
  { id:"nut", nome:"Nut Ruth", recheio:[{n:"Nutella", g:30, unidade:"kg", porCookie:true, tamTipico:350}] },
  { id:"kinder", nome:"Kinder Ruth", recheio:[
    {n:"Kinder Bueno", g:0, unidade:"kg", porCookie:true, pendente:true},
    {n:"Chocolate branco (Kinder Ruth)", g:0, unidade:"kg", porCookie:true, pendente:true}
  ] },
  { id:"croc", nome:"Croc Ruth", recheio:[{n:"Ovomaltine", g:30, unidade:"kg", porCookie:true, tamTipico:370}] },
];

const STORAGE_KEY = "casaruth_precos";
function loadPrecos(){
  try{
    const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    // migra formato antigo (preço direto por unidade, ex: ovo) para {tam:1, preco}
    Object.keys(p).forEach(nome=>{
      if (typeof p[nome] !== "object"){
        p[nome] = { tam: "1", preco: String(p[nome]) };
      }
    });
    return p;
  }catch(e){ return {}; }
}
function savePrecos(p){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }catch(e){}
  marcarAlterado();
}
let precos = loadPrecos();

function custoIngrediente(ing){
  if (estaPendente(ing)) return null;
  const dados = precos[ing.n];
  if (ing.unidade === "un") {
    const tam = parseFloat(dados?.tam);
    const precoTotal = parseFloat(dados?.preco);
    if (!dados || isNaN(tam) || isNaN(precoTotal) || tam <= 0) return null;
    return (precoTotal / tam) * (ing.qtd ?? 1);
  }
  const tam = parseFloat(dados?.tam ?? ing.tamTipico);
  const preco = parseFloat(dados?.preco);
  if (!dados || isNaN(tam) || isNaN(preco) || tam <= 0) return null;
  return (preco / tam) * gramasEfetivas(ing);
}

function inputRow(ing){
  const un = ing.unidade === "un" ? "un" : "kg";
  let qtyLabel;
  if (ing.porCookie){
    const val = recheioGramas[ing.n] ?? (ing.g > 0 ? ing.g : "");
    qtyLabel = `<input class="recheio-g-input" data-ing="${ing.n}" type="number" step="0.1" inputmode="decimal"
      placeholder="g/cookie" value="${val}" style="width:60px; text-align:right; padding:0.2rem; border-radius:6px; border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;"> g/cookie`;
  } else {
    qtyLabel = un === "un" ? `${ing.qtd ?? 1} un` : `${ing.g}g`;
  }

  return `<tr>
    <td>${ing.n}</td>
    <td class="qty">${qtyLabel}</td>
  </tr>`;
}

function tableHead(){

function custoMassaBase(){
  let custo = 0, faltando = 0;
  massaBase.forEach(ing=>{
    const c = custoIngrediente(ing);
    if (c === null) faltando++; else custo += c;
  });
  return { custo, faltando };
}

function custoEmbalagemPorCookie(){
  return itensExtras.reduce((soma, it)=>{
    if (!it.porCookie) return soma;
    const preco = parseFloat(it.precoUnitario);
    if (isNaN(preco)) return soma;
    return soma + preco;
  }, 0);
}

function custoPorCookieDoSabor(s){
  const { custo: custoBase, faltando: faltBase } = custoMassaBase();
  const custoMassaPorCookie = custoBase / RENDIMENTO_FORNADA;
  let custoRecheio = 0, faltRecheio = 0;
  s.recheio.forEach(ing=>{
    const c = custoIngrediente(ing);
    if (c === null) faltRecheio++; else custoRecheio += c;
  });
  const faltando = faltBase + faltRecheio;
  return faltando > 0 ? null : (custoMassaPorCookie + custoRecheio + custoEmbalagemPorCookie());
}

function gramasEfetivas(ing){
  const ov = parseFloat(recheioGramas[ing.n]);
  return (!isNaN(ov) && ov > 0) ? ov : ing.g;
}
function estaPendente(ing){
  return !!ing.pendente && !(parseFloat(recheioGramas[ing.n]) > 0);

function consumoPorCookie(ing, deMassaBase){
  if (ing.unidade === "un") {
    const qtd = ing.qtd ?? 1;
    return deMassaBase ? (qtd / RENDIMENTO_FORNADA) : qtd; // 1 ovo é por FORNADA, não por cookie
  }
  const g = gramasEfetivas(ing);
  return deMassaBase ? (g / RENDIMENTO_FORNADA) : g; // recheio já é por cookie
}

function unidadeDoItem(nome){

}

async function setupNota(){
  const card = document.getElementById("nota-card");
  if (!card) return;
  const status = document.getElementById("nota-status");
  const out = document.getElementById("nota-resultado");
  const fileInp = document.getElementById("nota-file");
  const btn = document.getElementById("nota-ler");

  let sample = null;
  try{
    if (window.claude && typeof window.claude.use === "function") sample = await window.claude.use("sample");
  }catch(e){ sample = null; }
  if (!sample){
    btn.disabled = true; fileInp.disabled = true;
    status.textContent = "A leitura de nota por foto só funciona dentro do Claude (não neste site).";
    return;
  }

  btn.onclick = async ()=>{
    const file = fileInp.files && fileInp.files[0];
    if (!file){ status.textContent = "Escolha ou tire uma foto primeiro."; return; }
    const nomes = todosIngredientesUnicos().map(i=>i.n).concat(itensExtras.map(it=>it.nome));
    const prompt = `Esta é a foto de uma nota fiscal ou de produtos comprados por uma confeitaria de cookies.
Liste cada item comprado. Responda SOMENTE com um array JSON de objetos com estes campos:
- "descricao": o texto do item como aparece na nota
- "ingrediente": um dos nomes EXATOS desta lista, ou null se nenhum corresponder: ${JSON.stringify(nomes)}
- "quantidade": total comprado desse item, como número (peso em gramas: converta kg para g; ovos e embalagens em unidades, dúzia = 12), ou null se não der para ler
- "preco": valor total pago por esse item, em reais, como número com ponto decimal (12,90 vira 12.9), ou null se não der para ler
Exemplo: [{"descricao":"FARINHA TRIGO 1KG","ingrediente":"Farinha de trigo","quantidade":1000,"preco":6.5}]`;
    btn.disabled = true; out.innerHTML = ""; status.textContent = "Lendo a foto...";
    try{
      const itens = await sample.json(prompt, {images:[file]});
      mostrarNota(Array.isArray(itens) ? itens : [], nomes, status, out);
    }catch(e){
      status.textContent = msgErroNota(e && e.code, e);
    }finally{ btn.disabled = false; }
  };
}

function mostrarNota(itens, nomes, status, out){
  if (!itens.length){ status.textContent = "Não encontrei itens nessa foto."; return; }
  status.textContent = "Confira os itens abaixo. Ajuste o que estiver errado e aplique.";
  out.innerHTML = itens.map((it,i)=>{
    const sel = nomes.includes(it.ingrediente) ? it.ingrediente : "";
    return `<div class="nota-item" style="border-top:1px solid rgba(176,141,87,0.3); padding:0.6rem 0;">

        ${nomes.map(n=>`<option value="${esc(n)}" ${n===sel?"selected":""}>${esc(n)}</option>`).join("")}
      </select>
      <div style="display:flex; gap:0.6rem; margin-top:0.4rem; align-items:center;">
        <input class="nota-qtd" type="number" step="0.01" inputmode="decimal" value="${it.quantidade ?? ""}" placeholder="qtd" style="width:90px; padding:0.35rem; border-radius:6px; border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;">
        <span class="nota-un">${sel ? unidadeDoItem(sel) : ""}</span>
        <span style="margin-left:auto;">R$</span>
        <input class="nota-preco" type="number" step="0.01" inputmode="decimal" value="${it.preco ?? ""}" placeholder="0,00" style="width:80px; padding:0.35rem; border-radius:6px; border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;">
      </div>
    </div>`;
  }).join("") + `<label style="display:flex; align-items:center; gap:0.5rem; font-size:0.88rem; margin-top:0.8rem;"><input type="checkbox" id="nota-caixa" checked> Lançar a saída no Caixa</label>
    <button id="nota-aplicar" style="margin-top:0.6rem; width:100%; border:1px solid var(--wine); background:var(--wine); color:var(--cream); border-radius:6px; padding:0.6rem; cursor:pointer;">Aplicar ao estoque, ao custo médio e ao Caixa</button>`;

  out.querySelectorAll(".nota-sel").forEach(s=>{
    s.addEventListener("change", ()=>{
      s.closest(".nota-item").querySelector(".nota-un").textContent = s.value ? unidadeDoItem(s.value) : "";
    });
  });

  out.querySelector("#nota-aplicar").onclick = ()=>{
    const itensCompra = [];
    out.querySelectorAll(".nota-item").forEach(div=>{
      const nome = div.querySelector(".nota-sel").value;
      const qtd = parseFloat(div.querySelector(".nota-qtd").value);
      const valor = parseFloat(div.querySelector(".nota-preco").value);
      if (!nome || isNaN(qtd) || qtd <= 0) return;
      itensCompra.push({ nome, qtd, valor: (!isNaN(valor) && valor > 0) ? valor : 0 });
    });
    const st = document.getElementById("nota-status");
    if (!itensCompra.length){ if (st) st.textContent = "Nenhum item foi aplicado."; return; }
    const lancar = !!out.querySelector("#nota-caixa").checked;
    const compra = registrarCompra({ itens: itensCompra, dataISO: hojeISO(), lancarCaixa: lancar, origem: "nota" });
    const semValor = compra.itens.filter(d=> !(d.valor > 0)).length;
    render();
    renderComprar(`Nota aplicada: ${compra.itens.length} item(ns) somado(s) ao estoque, total ${brl(compra.total)}.` +
      (lancar && compra.total > 0 ? " Saída lançada no Caixa." : "") +
      (semValor ? ` ${semValor} item(ns) sem valor: só entraram no estoque, o custo não mudou.` : ""));
  };
}

function tableHeadStock(){

function calcularCapacidadeTotalMassa(){
  let minCookies = Infinity, algumCadastrado = false;
  massaBase.forEach(ing=>{
    const disp = parseFloat(estoque[ing.n]);
    if (!isNaN(disp)) algumCadastrado = true;
    const consumo = consumoPorCookie(ing, true);
    const possiveis = isNaN(disp) ? 0 : Math.max(0, Math.floor(disp/consumo));
    if (possiveis < minCookies) minCookies = possiveis;
  });
  if (minCookies===Infinity) minCookies=0;
  return { minCookies, algumCadastrado };
}

function calcularDaPraFazer(s){
  if (s.recheio.some(i=>estaPendente(i))){
    return { minCookies: 0, gargalo: null, estoqueVazio: false, receitaIncompleta: true };
  }
  const ingredientes = ingredientesDoSabor(s);
  let minCookies = Infinity, gargalo = null, algumCadastrado = false;
  ingredientes.forEach(({ing, deBase})=>{
    const disp = parseFloat(estoque[ing.n]);
    if (!isNaN(disp)) algumCadastrado = true;
    const consumo = consumoPorCookie(ing, deBase);
    const possiveis = isNaN(disp) ? 0 : Math.max(0, Math.floor(disp/consumo));
    if (possiveis < minCookies){ minCookies = possiveis; gargalo = ing.n; }
  });
  if (minCookies===Infinity) minCookies=0;
  return { minCookies, gargalo: algumCadastrado ? gargalo : null, estoqueVazio: !algumCadastrado, receitaIncompleta: false };
}

function renderRendimentos(){
  const el = document.getElementById("rendimentos");
  if (!el) return;
  const linhas = sabores.map(s=>{
    const { minCookies, gargalo, estoqueVazio, receitaIncompleta } = calcularDaPraFazer(s);
    let nota = "";
    if (receitaIncompleta) nota = `<div class="gargalo">receita ainda incompleta (confira em Receitas)</div>`;
    else if (estoqueVazio) nota = `<div class="gargalo">estoque ainda não cadastrado</div>`;
    else if (minCookies < RENDIMENTO_FORNADA) nota = `<div class="gargalo">falta ingrediente: ${gargalo}</div>`;

    return `<div class="summary" style="border-top:1px solid rgba(176,141,87,0.3); padding:0.6rem 0;">
      <div style="min-width:140px;"><span class="label">${s.nome}</span><span class="value">${receitaIncompleta ? "—" : minCookies+" cookies"}</span></div>
      ${nota}
    </div>`;
  }).join("");
  el.innerHTML = linhas + `<p style="font-size:0.8rem; opacity:0.65; margin-top:0.6rem;">Cada número é "se eu usasse todo o estoque só nesse sabor". Fazendo mais de um sabor, o estoque se divide e esses números caem.</p>`;
}

// soma de cookies bons por mês (anoMes -> total), feito a partir do histórico de produção
function historicoMensalProducao(){
  const porMes = {};
  historicoProducao.forEach(f=>{
    const anoMes = (f.dataISO || f.data.split("/").reverse().join("-")).slice(0,7);
    porMes[anoMes] = (porMes[anoMes]||0) + f.bons;
  });
  return Object.entries(porMes).sort((a,b)=> a[0]<b[0]?-1:1).map(([anoMes,bons])=>({anoMes,bons}));
}

// média dos últimos N meses JÁ FECHADOS (não conta o mês atual)
function mediaHistoricaCookies(n){
  const mAtual = mesAtual();
  const meses = historicoMensalProducao().filter(m=>m.anoMes !== mAtual);
  if (meses.length === 0) return null;
  const ultimos = meses.slice(-n);
  return ultimos.reduce((s,m)=>s+m.bons,0) / ultimos.length;
}

function volumeBaseComparacao(){
  if (baseHistorica.modo === "media"){
    const n = parseInt(baseHistorica.meses) || 3;
    const media = mediaHistoricaCookies(n);
    if (media !== null && media > 0) return { valor: media, origem: `média dos últimos ${n} meses` };
  }
  const manual = parseFloat(baseHistorica.valorManual);
  return { valor: (manual>0?manual:null), origem: "valor manual" };
}

function custoVariavelMedio(){
  const custos = sabores.map(s=>custoPorCookieDoSabor(s)).filter(c=>c!==null);
  if (!custos.length) return null;
  return custos.reduce((a,b)=>a+b,0)/custos.length;
}

function custoProjetado(volume){
  const cv = custoVariavelMedio();
  if (cv===null || !volume || volume<=0) return null;
  return cv + totalCustosFixos()/volume;
}

// ---- Preço e lucro (passo 5b): junta o antigo Custo/cookie e Financeiro ----
// Custo por cookie se os preços ficarem iguais ao ÚLTIMO PAGO de cada item (só leitura, não grava nada)
function custoPorCookieUltimoPago(s){
  const fator = nome => { const c = custoAtualUnit(nome), u = ultimoPrecoPago(nome); return (c && u) ? u / c : 1; };
  let massa = 0, rec = 0, emb = 0;
  massaBase.forEach(ing=>{ const c = custoIngrediente(ing); if (c !== null) massa += c * fator(ing.n); });
  s.recheio.forEach(ing=>{ const c = custoIngrediente(ing); if (c !== null) rec += c * fator(ing.n); });
  itensExtras.forEach(it=>{
    if (!it.porCookie) return;
    const p = parseFloat(it.precoUnitario);
    if (!isNaN(p)) emb += p * fator(it.nome);
  });
  return massa / RENDIMENTO_FORNADA + rec + emb;
}

function renderPreco(){
  const el = document.getElementById("preco");
  if (!el) return;
  const fixo = totalCustosFixos();
  const base = volumeBaseComparacao();
  const meta = parseFloat(metaProducaoMensal) || null;
  const vol = base.valor || meta || null;
  const origemVol = base.valor ? base.origem : "meta do mês";
  const fixoPorCookie = vol ? fixo / vol : null;
  const verde = "color:#3F7D4F;", vinho = "color:var(--wine);";

  // uma linha de contas por sabor
  const lin = sabores.map(s=>{
    const custoVar = custoPorCookieDoSabor(s);
    const preco = parseFloat(precosVenda[s.id]);
    const temPreco = !isNaN(preco) && preco > 0;
    const ok = custoVar !== null && temPreco && fixoPorCookie !== null;
    const custoTotal = ok ? custoVar + fixoPorCookie : null;
    const sobra = ok ? preco - custoTotal : null;
    const pct = ok ? (sobra / preco) * 100 : null;
    const sugerido = ok ? custoTotal / (1 - margemDesejada / 100) : null;
    // quanto o custo de ingrediente+embalagem precisaria cair para manter a margem sem mexer no preço
    const custoVarMax = ok ? preco * (1 - margemDesejada / 100) - fixoPorCookie : null;
    const cortar = ok ? custoVar - custoVarMax : null;
    const ult = custoVar !== null ? custoPorCookieUltimoPago(s) : null;
    return { s, nome: NOME_SABOR[s.id], custoVar, preco, temPreco, ok, custoTotal, sobra, pct, sugerido, cortar, ult };
  });
  const completos = lin.filter(l=>l.ok);
  const semCusto = lin.filter(l=>l.custoVar === null).map(l=>l.nome);
  const semVenda = lin.filter(l=>!l.temPreco).map(l=>l.nome);

  // ---- 1) veredito ----
  let veredito;
  if (!completos.length){
    veredito = `<p style="font-size:0.95rem; line-height:1.5;">Ainda não dá para dizer. ${semCusto.length ? `Falta preço de ingrediente em: ${semCusto.join(", ")} (registre a compra na aba Comprar). ` : ""}${semVenda.length ? `Falta o preço de venda de: ${semVenda.join(", ")} (Config). ` : ""}${!vol ? "Falta a meta do mês ou a base de cookies por mês em Config." : ""}</p>`;
  } else {
    const prejuizo = completos.filter(l=>l.sobra < 0).map(l=>l.nome);
    const baratos = completos.filter(l=>l.sobra >= 0 && l.pct < margemDesejada).map(l=>l.nome);
    const linhas = [];
    linhas.push(prejuizo.length
      ? `<span style="${vinho} font-weight:600;">Não está dando lucro em: ${prejuizo.join(", ")}.</span> Cada cookie vendido custa mais do que você cobra.`
      : `<span style="${verde} font-weight:600;">Está dando lucro em todos os sabores calculados.</span>`);
    linhas.push(baratos.length
      ? `Cookie barato para a margem que você quer (${margemDesejada}%): ${baratos.join(", ")}.`
      : (prejuizo.length === completos.length ? "" : `Os preços batem com a margem que você quer (${margemDesejada}%).`));
    if (semCusto.length || semVenda.length) linhas.push(`<span style="font-size:0.85rem; opacity:0.75;">Fora da conta por falta de dado: ${[...new Set([...semCusto, ...semVenda])].join(", ")}.</span>`);
    veredito = `<p style="font-size:0.95rem; line-height:1.6;">${linhas.filter(Boolean).join("<br>")}</p>`;
  }

  // ---- 2) tabela por sabor ----
  const tabela = lin.map(l=>`<tr>
      <td>${l.nome}</td>
      <td class="qty">${l.custoTotal === null ? "—" : brl(l.custoTotal)}</td>
      <td class="qty">${l.temPreco ? brl(l.preco) : "—"}</td>
      <td class="price" style="${l.sobra !== null ? (l.sobra < 0 ? vinho : "") : ""}">${l.sobra === null ? "—" : `${brl(l.sobra)} (${l.pct.toFixed(0)}%)`}</td>
    </tr>`).join("");
  const cvMedio = custoVariavelMedio();
  const explicaCusto = (cvMedio !== null && fixoPorCookie !== null)
    ? `Custo = ingredientes e embalagem (em média ${brl(cvMedio)}) + parte das contas fixas (${brl(fixoPorCookie)} por cookie: ${brl(fixo)} do mês divididos por ${Math.round(vol)} cookies, ${origemVol}). Sobra = preço de venda menos o custo.`
    : "O custo aparece quando todos os ingredientes tiverem preço e houver uma base de cookies por mês em Config.";

  // ---- 3) o que acontece se continuar assim ----
  let futuro = "";
  if (completos.length){
    const margemMed = completos.reduce((a,l)=> a + (l.preco - l.custoVar), 0) / completos.length;
    const equilibrio = margemMed > 0 ? Math.ceil(fixo / margemMed) : null;
    const lucroVol = margemMed * vol - fixo;
    const cenarios = [Math.round(vol * 0.5), Math.round(vol), Math.round(vol * 1.5)];
    futuro = `<div class="recipe">
      <h2>Se continuar assim</h2>
      <div class="summary">
        <div><span class="label">Precisa vender para empatar</span><span class="value">${equilibrio === null ? "nunca (preço menor que o custo)" : equilibrio + " cookies/mês"}</span></div>
        <div><span class="label">Se vender ${Math.round(vol)} por mês</span><span class="value" style="${lucroVol < 0 ? vinho : verde}">${lucroVol < 0 ? "perde " : "sobra "}${brl(Math.abs(lucroVol))}</span></div>
      </div>
      <div class="sub" style="margin-top:0.6rem;">Quanto cada cookie custa, conforme o tanto que você produz no mês (as contas fixas se diluem):</div>
      <div class="summary" style="margin-top:0.3rem;">
        ${cenarios.map(n=>`<div><span class="label">${n} cookies</span><span class="value">${brl(cvMedio + fixo / n)}</span></div>`).join("")}
      </div>
      <p style="font-size:0.8rem; opacity:0.65; margin-top:0.5rem;">Conta feita com a média dos sabores. O lucro real do mês, com o que já foi vendido, está no Painel.</p>
    </div>`;
  }

  // ---- 4) ingredientes: subindo ou não ----
  const nomesItens = todosIngredientesUnicos().map(i=>i.n).concat(itensExtras.map(it=>it.nome));
  const mov = [];
  nomesItens.forEach(nome=>{
    const info = infoItemCompra(nome); if (!info) return;
    const c = custoAtualUnit(nome), u = ultimoPrecoPago(nome);
    if (c === null || u === null) return;
    const v = (u - c) / c * 100;
    if (Math.abs(v) >= 3) mov.push({ nome, v, porKg: info.un === "g", c, u });
  });
  mov.sort((a,b)=> b.v - a.v);
  const fmtP = (m, n) => m.porKg ? brl(n * 1000) + "/kg" : brlUn(n) + "/un";
  const comUlt = lin.filter(l=>l.ult !== null && l.temPreco && fixoPorCookie !== null);
  let efeito = "";
  if (comUlt.length){
    const dif = comUlt.reduce((a,l)=> a + (l.ult - l.custoVar), 0) / comUlt.length;
    efeito = Math.abs(dif) < 0.005
      ? `Os últimos preços pagos estão iguais ao custo médio: nada pesando a mais.`
      : (dif > 0
        ? `<span style="${vinho}">Se os preços da última compra viram o normal, cada cookie passa a custar ${brl(dif)} a mais (média dos sabores).</span>`
        : `Se os preços da última compra viram o normal, cada cookie passa a custar ${brl(-dif)} a menos (média dos sabores).`);
  }
  const ingred = `<div class="recipe">
      <h2>Os ingredientes estão subindo?</h2>
      ${mov.length ? `<table class="tabela-real" style="margin-top:0.4rem;"><thead><tr><th>Item</th><th class="qty">Médio</th><th class="qty">Último</th><th class="price">Variação</th></tr></thead><tbody>${mov.slice(0,8).map(m=>`<tr>
        <td>${esc(m.nome)}</td><td class="qty">${fmtP(m, m.c)}</td><td class="qty">${fmtP(m, m.u)}</td>
        <td class="price" style="${m.v > 0 ? vinho : verde}">${m.v > 0 ? "+" : ""}${m.v.toFixed(0)}%</td></tr>`).join("")}</tbody></table>`
        : `<p style="font-size:0.9rem; opacity:0.75;">Nenhum item com mudança de 3% ou mais entre o custo médio e o último preço pago (ou ainda não há compras registradas com valor).</p>`}
      ${efeito ? `<p style="font-size:0.88rem; line-height:1.5; margin-top:0.6rem;">${efeito}</p>` : ""}
    </div>`;

  // ---- 5) subir o preço ou controlar a compra ----
  const decisao = completos.length ? `<div class="recipe">
      <h2>Subir o preço ou controlar a compra?</h2>
      <div style="display:flex; align-items:center; gap:0.5rem; margin-top:0.4rem;">
        <span>Margem que eu quero:</span>
        <input id="margem-desejada" type="number" step="1" min="0" max="94" value="${margemDesejada}" style="width:60px; text-align:right; padding:0.3rem; border-radius:6px; border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;">%
      </div>
      <ul style="margin:0.6rem 0 0; padding-left:1.2rem; font-size:0.9rem; line-height:1.5;">
        ${completos.map(l=> l.pct >= margemDesejada
          ? `<li><strong>${l.nome}:</strong> o preço de ${brl(l.preco)} já dá ${l.pct.toFixed(0)}%. Não precisa subir.</li>`
          : `<li><strong>${l.nome}:</strong> para ter ${margemDesejada}% o preço teria de ser <strong>${brl(l.sugerido)}</strong> (hoje ${brl(l.preco)}). ${l.cortar < l.custoVar * 0.3 ? `Ou, sem mexer no preço, baixar o custo de ingredientes e embalagem em ${brl(l.cortar)} por cookie (${(l.cortar / l.custoVar * 100).toFixed(0)}%), comprando mais barato.` : `Comprar mais barato não resolve sozinho (o corte pedido é grande demais): aqui precisa subir o preço.`}</li>`).join("")}
      </ul>
      <p style="font-size:0.8rem; opacity:0.65; margin-top:0.5rem;">Comprar com desconto resolve quando o corte pedido é pequeno. Se for grande, só subir o preço resolve.</p>
    </div>` : "";

  el.innerHTML = `
    <div class="recipe">
      <h2>Estou tendo lucro?</h2>
      ${veredito}
      <table class="tabela-real" style="margin-top:0.5rem;"><thead><tr><th>Sabor</th><th class="qty">Custo</th><th class="qty">Venda</th><th class="price">Sobra</th></tr></thead><tbody>${tabela}</tbody></table>
      <p style="font-size:0.8rem; opacity:0.65; margin-top:0.5rem;">${explicaCusto}</p>
    </div>
    ${futuro}
    ${ingred}
    ${decisao}
  `;

  const mi = el.querySelector("#margem-desejada");
  if (mi) mi.addEventListener("change", e=>{
    const v = parseFloat(e.target.value);
    if (!isNaN(v) && v >= 0 && v < 95){ margemDesejada = v; renderPreco(); }
  });
}

// ---- Estoque de cookies (congelados e assados) ----
const MOLDADOS_KEY = "casaruth_moldados";
const SALDO_COOKIES_KEY = "casaruth_cookies_saldo";
function loadMoldados(){
  try{
    const list = JSON.parse(localStorage.getItem(MOLDADOS_KEY)||"[]");
    list.forEach(m=>{ if (!m.id) m.id = Date.now()+Math.random(); });
    return list;
  }catch(e){ return []; }
}
function saveMoldados(list){ try{ localStorage.setItem(MOLDADOS_KEY, JSON.stringify(list)); }catch(e){} marcarAlterado(); }
let historicoMoldados = loadMoldados();

function normalizarSaldoCookies(sd){
  sd = (sd && typeof sd === "object") ? sd : {};
  if (!sd.congelados || typeof sd.congelados !== "object") sd.congelados = {};
  if (!sd.assados || typeof sd.assados !== "object") sd.assados = {};
  return sd;
}
function loadSaldoCookies(){
  try{ return normalizarSaldoCookies(JSON.parse(localStorage.getItem(SALDO_COOKIES_KEY)||"{}")); }
  catch(e){ return normalizarSaldoCookies({}); }
}
function saveSaldoCookies(sd){ try{ localStorage.setItem(SALDO_COOKIES_KEY, JSON.stringify(sd)); }catch(e){} marcarAlterado(); }
let saldoCookies = loadSaldoCookies();
function saldoDe(tipo, saborId){ return parseInt(saldoCookies[tipo][saborId]) || 0; }
function somaSaldo(tipo, saborId, delta){ saldoCookies[tipo][saborId] = saldoDe(tipo, saborId) + delta; }

const NOME_SABOR = {choco:"Choco Ruth", nut:"Nut Ruth", kinder:"Kinder Ruth", croc:"Croc Ruth"};
const CK_INPUT = "padding:0.5rem; border-radius:6px; border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;";
const CK_BTN = "border:1px solid var(--wine); background:var(--wine); color:var(--cream); border-radius:6px; padding:0.5rem; cursor:pointer;";
const CK_BTN_RM = "border:1px solid var(--wine); background:transparent; color:var(--wine); border-radius:6px; padding:0.15rem 0.5rem; font-size:0.8rem; cursor:pointer;";

function saldoTexto(n){
  return n < 0 ? `<span style="color:var(--wine); font-weight:600;">${n}</span>` : String(n);
}
function tabelaSaldos(){
  const linhas = sabores.map(s=>`<tr><td>${NOME_SABOR[s.id]||s.id}</td>
    <td class="qty">${saldoTexto(saldoDe("congelados", s.id))}</td>
    <td class="qty">${saldoTexto(saldoDe("assados", s.id))}</td></tr>`).join("");
  return `<table class="tabela-real"><thead><tr><th>Sabor</th><th class="qty">Congelados</th><th class="qty">Assados</th></tr></thead><tbody>${linhas}</tbody></table>`;
}

// sinal -1 = desconta os ingredientes; +1 = devolve. Retorna a lista do que ficou faltando.
function ajustarIngredientes(saborId, total, sinal){
  const faltou = [];
  const s = sabores.find(x=>x.id===saborId);
  if (!s) return faltou;
  ingredientesDoSabor(s).forEach(({ing, deBase})=>{
    const consumo = consumoPorCookie(ing, deBase) * total;
    const atual = parseFloat(estoque[ing.n]) || 0;
    if (sinal < 0){
      if (atual < consumo) faltou.push(ing.n);
      estoque[ing.n] = (atual - consumo).toFixed(2);   // pode ficar negativo de propósito: mostra que falta registrar compra ou contagem
    } else {
      estoque[ing.n] = (atual + consumo).toFixed(2);
    }
  });
  saveStock(estoque);
  return faltou;
}

// Antes de moldar: lista o que vai faltar (tem X, precisa de Y)
function faltaParaMoldar(saborId, total){
  const lista = [];
  const s = sabores.find(x=>x.id===saborId);
  if (!s) return lista;
  ingredientesDoSabor(s).forEach(({ing, deBase})=>{
    const consumo = consumoPorCookie(ing, deBase) * total;
    const atual = parseFloat(estoque[ing.n]) || 0;
    if (atual < consumo){
      const un = ing.unidade === "un" ? "un" : "g";
      lista.push(`${ing.n}: tem ${fmtQtdCompra(un, atual)}, precisa de ${fmtQtdCompra(un, consumo)}`);
    }
  });
  return lista;
}

function renderCookies(){
  const el = document.getElementById("cookies");
  const historico = historicoMoldados.slice().reverse().slice(0,15).map(m=>`
    <tr>
      <td>${m.data}</td>
      <td>${NOME_SABOR[m.sabor] || m.sabor}</td>
      <td class="qty">${m.qtd}</td>
      <td class="price" style="text-align:right;"><button class="rm-moldagem" data-id="${m.id}" style="${CK_BTN_RM}">Excluir</button></td>
    </tr>`).join("");

  const linhasAjuste = sabores.map(s=>`<tr><td>${NOME_SABOR[s.id]||s.id}</td>
    <td class="qty"><input class="aj-cong" data-sabor="${s.id}" type="number" inputmode="numeric" value="${saldoDe("congelados", s.id)}" style="width:5rem; ${CK_INPUT}"></td>
    <td class="qty"><input class="aj-asso" data-sabor="${s.id}" type="number" inputmode="numeric" value="${saldoDe("assados", s.id)}" style="width:5rem; ${CK_INPUT}"></td></tr>`).join("");

  el.innerHTML = `
    <div class="recipe">
      <h2>Moldei cookies</h2>
      <div class="sub">Desconta os ingredientes e coloca os cookies no congelador</div>
      <div style="display:flex; flex-direction:column; gap:0.6rem; margin-top:0.6rem;">
        <select id="mold-sabor" style="${CK_INPUT}">
          ${sabores.map(s=>`<option value="${s.id}">${NOME_SABOR[s.id]||s.id}</option>`).join("")}
        </select>
        <input id="mold-data" type="date" value="${hojeISO()}" style="${CK_INPUT}">
        <input id="mold-qtd" type="number" min="1" inputmode="numeric" placeholder="Quantos cookies moldou" style="${CK_INPUT}">
        <button id="mold-salvar" style="${CK_BTN}">Registrar moldagem</button>
        <div id="mold-msg" style="font-size:0.85rem;"></div>
      </div>
    </div>
    <div class="recipe">
      <h2>Saldo de cookies</h2>
      <div class="sub">Congelados esperando para assar e assados prontos para vender</div>
      ${tabelaSaldos()}
    </div>
    <div class="recipe">
      <h2>Acertar saldos</h2>
      <div class="sub">Use para começar ou quando contar o que tem de verdade. Não mexe nos ingredientes.</div>
      <table><thead><tr><th>Sabor</th><th class="qty">Congelados</th><th class="qty">Assados</th></tr></thead><tbody>${linhasAjuste}</tbody></table>
      <button id="saldo-salvar" style="${CK_BTN} margin-top:0.6rem;">Salvar saldos</button>
      <div id="saldo-msg" style="font-size:0.85rem; margin-top:0.4rem;"></div>
    </div>
    <div class="recipe">
      <h2>Últimas moldagens</h2>
      <table><thead><tr><th>Data</th><th>Sabor</th><th class="qty">Qtd</th><th></th></tr></thead>
      <tbody>${historico || `<tr><td colspan="4" style="opacity:0.6;">Nenhuma moldagem registrada ainda</td></tr>`}</tbody></table>
    </div>
  `;

  el.querySelector("#mold-salvar").addEventListener("click", ()=>{
    const saborId = el.querySelector("#mold-sabor").value;
    const qtd = parseInt(el.querySelector("#mold-qtd").value) || 0;
    const msgEl = el.querySelector("#mold-msg");
    msgEl.style.color = "var(--wine)";
    if (qtd <= 0){ msgEl.textContent = "Digite quantos cookies você moldou."; return; }

    const previaFalta = faltaParaMoldar(saborId, qtd);
    if (previaFalta.length && !confirm("Não tem ingrediente suficiente para moldar:\n" + previaFalta.join("\n") + "\n\nRegistre a compra na aba Comprar antes, se já comprou. Registrar a moldagem mesmo assim? O estoque desses itens ficará negativo.")) return;
    const faltou = ajustarIngredientes(saborId, qtd, -1);
    somaSaldo("congelados", saborId, qtd);
    saveSaldoCookies(saldoCookies);

    const dataISO = el.querySelector("#mold-data").value || hojeISO();
    historicoMoldados.push({id: Date.now()+Math.random(), data: isoParaBR(dataISO), dataISO, sabor: saborId, qtd});
    saveMoldados(historicoMoldados);

    const aviso = faltou.length
      ? `Registrado — mas o estoque de ${faltou.join(", ")} ficou negativo. Registre a compra em Comprar ou corrija a contagem em Estoque.`
      : "Moldagem registrada: ingredientes descontados e cookies no congelador.";
    renderCookies();
    const m2 = document.getElementById("mold-msg");
    if (m2){ m2.style.color = "var(--wine)"; m2.textContent = aviso; }
  });

  el.querySelector("#saldo-salvar").addEventListener("click", ()=>{
    el.querySelectorAll(".aj-cong").forEach(i=>{ saldoCookies.congelados[i.dataset.sabor] = parseInt(i.value) || 0; });
    el.querySelectorAll(".aj-asso").forEach(i=>{ saldoCookies.assados[i.dataset.sabor] = parseInt(i.value) || 0; });
    saveSaldoCookies(saldoCookies);
    renderCookies();
    const m2 = document.getElementById("saldo-msg");
    if (m2) m2.textContent = "Saldos salvos.";
  });

  el.querySelectorAll(".rm-moldagem").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = parseFloat(btn.dataset.id);
      const m = historicoMoldados.find(x=>x.id===id);
      if (!m) return;
      if (!confirm(`Excluir essa moldagem (${NOME_SABOR[m.sabor]||m.sabor}, ${m.qtd} cookies)? Os ingredientes voltam para o estoque e os cookies saem do congelador.`)) return;
      ajustarIngredientes(m.sabor, m.qtd, +1);
      somaSaldo("congelados", m.sabor, -m.qtd);
      saveSaldoCookies(saldoCookies);
      historicoMoldados = historicoMoldados.filter(x=>x.id!==id);
      saveMoldados(historicoMoldados);
      renderCookies();
    });
  });
}

// ---- Produção / Fornadas ----
const PRODUCAO_KEY = "casaruth_producao";
function loadProducao(){

    const list = JSON.parse(localStorage.getItem(PRODUCAO_KEY)||"[]");
    list.forEach(f=>{ if (!f.id) f.id = Date.now()+Math.random(); });
    return list;
  }catch(e){return [];}
}
function saveProducao(list){ try{ localStorage.setItem(PRODUCAO_KEY, JSON.stringify(list)); }catch(e){} marcarAlterado(); }
let historicoProducao = loadProducao();

function ingredientesDoSabor(s){
  return massaBase.map(i=>({ing:i, deBase:true}))
    .concat(s.recheio.filter(i=>!estaPendente(i)).map(i=>({ing:i, deBase:false})));
}

    </div>

    const total = bons + perdidos;
    const msgEl = el.querySelector("#prod-msg");
    msgEl.style.color = "var(--wine)";
    if (total <= 0){ msgEl.textContent = "Digite quantos cookies saíram."; return; }

    const congelados = saldoDe("congelados", saborId);
    if (total > congelados){
      if (!confirm(`Você tem só ${congelados} ${NOME_SABOR[saborId]||saborId} no congelador e está assando ${total}. Registre a moldagem na aba Cookies antes. Registrar mesmo assim? O saldo de congelados ficará negativo.`)) return;
    }

    somaSaldo("congelados", saborId, -total);
    somaSaldo("assados", saborId, bons);
    saveSaldoCookies(saldoCookies);

    const dataISO = el.querySelector("#prod-data").value || hojeISO();
    historicoProducao.push({id: Date.now()+Math.random(), data: isoParaBR(dataISO), dataISO, sabor: saborId, bons, perdidos, v: 2});
    saveProducao(historicoProducao);

    renderProducao();
    const m2 = document.getElementById("prod-msg");
    if (m2){ m2.style.color = "var(--wine)"; m2.textContent = "Fornada registrada: saiu do congelador e os bons entraram em assados."; }
  });

  el.querySelectorAll(".rm-fornada").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = parseFloat(btn.dataset.id);
      const f = historicoProducao.find(x=>x.id===id);
      if (!f) return;
      const total = f.bons + f.perdidos;
      const nome = NOME_SABOR[f.sabor] || f.sabor;
      if (f.v === 2){
        if (!confirm(`Excluir essa fornada (${nome}, ${total} cookies)? Eles voltam para o congelador e os bons saem de assados.`)) return;
        somaSaldo("congelados", f.sabor, total);
        somaSaldo("assados", f.sabor, -f.bons);
        saveSaldoCookies(saldoCookies);
      } else {
        // fornada antiga (feita antes da separação): ela tinha descontado ingredientes
        if (!confirm(`Excluir essa fornada antiga (${nome}, ${total} cookies)? O estoque de ingredientes usado será devolvido.`)) return;
        ajustarIngredientes(f.sabor, total, +1);
      }
      historicoProducao = historicoProducao.filter(x=>x.id!==id);
      saveProducao(historicoProducao);
      renderProducao();
    });
  });
}

const VENDAS_KEY = "casaruth_vendas";
function loadVendas(){

    list.forEach(v=>{ if (!v.id) v.id = Date.now()+Math.random(); });

}
function saveVendas(list){ try{ localStorage.setItem(VENDAS_KEY, JSON.stringify(list)); }catch(e){} marcarAlterado(); }
let historicoVendas = loadVendas();

function mesAtual(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}
// Data de hoje no horário do aparelho (antes usava UTC e, depois das 20h em Tangará da Serra, já dava "amanhã")
function hojeISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
const ICONE_OK = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function isoParaBR(iso){ const [y,m,d] = iso.split("-"); return `${d}/${m}/${y}`; }

let modoVendaAtual = "avulso";
function renderVendas(){
  const el = document.getElementById("vendas");
  const nomesSabor = {choco:"Choco Ruth", nut:"Nut Ruth", kinder:"Kinder Ruth", croc:"Croc Ruth"};
  const mAtual = mesAtual();

  let totalCookies = 0, totalReceita = 0;
  const porSabor = {};
  historicoVendas.forEach(v=>{
    if (v.dataISO && v.dataISO.slice(0,7) === mAtual){
      if (v.tipo === "combo"){
        const qtdCombo = v.itens.reduce((s,it)=>s+it.qtd,0) * v.multiplicador;
        totalCookies += qtdCombo;
        totalReceita += v.valor;
        v.itens.forEach(it=>{ porSabor[it.saborId] = (porSabor[it.saborId]||0) + it.qtd*v.multiplicador; });
      } else {
        totalCookies += v.qtd;
        totalReceita += valorDaVenda(v);
        porSabor[v.sabor] = (porSabor[v.sabor]||0) + v.qtd;
      }
    }
  });

  const totalFixo = totalCustosFixos();
  const margens = sabores.map(s=>{
    const custo = custoPorCookieDoSabor(s);
    const preco = parseFloat(precosVenda[s.id]);
    return (custo!==null && !isNaN(preco)) ? preco-custo : null;
  }).filter(m=>m!==null);
  const margemMedia = margens.length ? margens.reduce((a,b)=>a+b,0)/margens.length : null;
  const pontoEquilibrio = margemMedia && margemMedia>0 ? Math.ceil(totalFixo/margemMedia) : null;

  const historico = historicoVendas.slice().reverse().slice(0,15).map(v=>{
    const descr = v.tipo==="combo" ? `Combo: ${esc(v.comboNome)} (x${v.multiplicador})` : (nomesSabor[v.sabor]||v.sabor);
    const qtdMostrada = v.tipo==="combo" ? v.itens.reduce((s,it)=>s+it.qtd,0)*v.multiplicador : v.qtd;
    return `<tr><td>${v.data}</td><td>${descr}</td><td class="qty">${qtdMostrada}</td>
    <td class="price" style="text-align:right;"><button class="rm-venda" data-id="${v.id}" style="border:1px solid var(--wine); background:transparent; color:var(--wine); border-radius:6px; padding:0.15rem 0.5rem; font-size:0.8rem; cursor:pointer;">excluir</button></td></tr>`;
  }).join("");

  el.innerHTML = `
    <div class="recipe">
      <h2>Registrar venda</h2>
      <div style="display:flex; flex-direction:column; gap:0.6rem; margin-top:0.6rem;">
        <div style="display:flex; gap:0.6rem;">
          <button class="venda-modo-btn active" data-modo="avulso" style="flex:1; border:1px solid var(--wine); background:var(--wine); color:var(--cream); border-radius:6px; padding:0.5rem; cursor:pointer; font-family:inherit;">Avulso</button>
          <button class="venda-modo-btn" data-modo="combo" style="flex:1; border:1px solid var(--wine); background:transparent; color:var(--wine); border-radius:6px; padding:0.5rem; cursor:pointer; font-family:inherit;" >Combo</button>
        </div>
        <div id="venda-campos-avulso">
          <select id="venda-sabor" style="width:100%; padding:0.5rem; border-radius:6px; border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;">
            ${sabores.map(s=>`<option value="${s.id}">${nomesSabor[s.id]}</option>`).join("")}
          </select>
          <input id="venda-qtd" type="number" placeholder="Quantidade vendida" style="width:100%; margin-top:0.6rem; padding:0.5rem; border-radius:6px; border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;">
        </div>
        <div id="venda-campos-combo" style="display:none;">
          ${combos.length===0 ? `<div class="aviso-combo">Você ainda não criou nenhum combo.<button id="ir-config-combo" type="button">Criar combo em Config</button></div>` : ""}
          <select id="venda-combo" ${combos.length===0?"hidden":""} style="width:100%; padding:0.5rem; border-radius:6px; border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;">
            ${combos.map(c=>`<option value="${c.id}">${esc(c.nome)} — R$ ${parseFloat(c.preco).toFixed(2)}</option>`).join("")}
          </select>
          <input id="venda-combo-mult" ${combos.length===0?"hidden":""} type="number" min="1" value="1" placeholder="Quantas vezes vendeu esse combo" style="width:100%; margin-top:0.6rem; padding:0.5rem; border-radius:6px; border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;">
        </div>
        <div style="font-size:0.85rem; opacity:0.85;">Assados prontos: ${sabores.map(sb=>`${NOME_SABOR[sb.id]||sb.id}: ${saldoTexto(saldoDe("assados", sb.id))}`).join(" · ")}</div>
        <input id="venda-data" type="date" value="${hojeISO()}" style="padding:0.5rem; border-radius:6px; border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;">
        ${itensExtras.filter(it=>!it.porCookie).map((it,i)=>`
          <input class="venda-extra-manual" data-nome="${esc(it.nome)}" type="number" step="1" placeholder="Quantos de ${esc(it.nome)} usou nesta venda?" style="padding:0.5rem; border-radius:6px; border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit;">
        `).join("")}
        <label style="display:flex; align-items:center; gap:0.5rem; font-size:0.9rem;">
          <input id="venda-lancar-caixa" type="checkbox"> Lançar essa receita direto no Caixa também
        </label>
        <button id="venda-salvar" style="border:1px solid var(--wine); background:var(--wine); color:var(--cream); border-radius:6px; padding:0.5rem; cursor:pointer;">Registrar venda</button>
      </div>
    </div>
    <div class="recipe">
      <h2>Este mês</h2>
      <div class="summary">
        <div><span class="label">Vendidos</span><span class="value">${totalCookies} cookies</span></div>
        <div><span class="label">Receita</span><span class="value">R$ ${totalReceita.toFixed(2)}</span></div>
        <div><span class="label">Meta (ponto de equilíbrio)</span><span class="value">${pontoEquilibrio===null?"—":pontoEquilibrio+" cookies"}</span></div>
      </div>
      ${pontoEquilibrio!==null ? `<p style="font-size:0.85rem; opacity:0.75; margin-top:0.6rem;">${totalCookies >= pontoEquilibrio ? `Meta batida esse mês ${ICONE_OK}` : `Faltam ${pontoEquilibrio-totalCookies} cookies para bater a meta.`}</p>` : ""}
    </div>
    <div class="recipe">
      <h2>Últimas vendas</h2>
      <table><thead><tr><th>Data</th><th>Sabor</th><th class="qty">Qtd</th><th></th></tr></thead>
      <tbody>${historico || `<tr><td colspan="4" style="opacity:0.6;">Nenhuma venda registrada ainda</td></tr>`}</tbody></table>
    </div>
  `;

  let modoVenda = modoVendaAtual;
  function aplicarModoVenda(){
    el.querySelectorAll(".venda-modo-btn").forEach(b=>{
      const ativo = b.dataset.modo === modoVenda;
      b.style.background = ativo ? "var(--wine)" : "transparent";
      b.style.color = ativo ? "var(--cream)" : "var(--wine)";
    });
    el.querySelector("#venda-campos-avulso").style.display = modoVenda==="avulso" ? "" : "none";
    el.querySelector("#venda-campos-combo").style.display = modoVenda==="combo" ? "" : "none";
  }
  el.querySelectorAll(".venda-modo-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      modoVenda = btn.dataset.modo;
      modoVendaAtual = modoVenda;
      aplicarModoVenda();
    });
  });
  aplicarModoVenda();
  const irCfgCombo = el.querySelector("#ir-config-combo");
  if (irCfgCombo) irCfgCombo.addEventListener("click", ()=> irPara("config"));

  el.querySelector("#venda-salvar").addEventListener("click", ()=>{
    const dataISO = el.querySelector("#venda-data").value || hojeISO();
    let qtdTotalCookies, entradaVenda, descricaoCaixa, valorCaixa;

    if (modoVenda === "combo"){
      const comboId = parseFloat(el.querySelector("#venda-combo").value);
      const mult = parseInt(el.querySelector("#venda-combo-mult").value) || 0;
      const combo = combos.find(c=>c.id===comboId);
      if (!combo || mult<=0) return;
      qtdTotalCookies = combo.itens.reduce((s,it)=>s+it.qtd,0) * mult;
      entradaVenda = {
        id: Date.now()+Math.random(), data: isoParaBR(dataISO), dataISO,
        tipo:"combo", comboId: combo.id, comboNome: combo.nome,
        itens: combo.itens, multiplicador: mult, valor: combo.preco*mult
      };
      descricaoCaixa = `Combo: ${combo.nome} (x${mult})`;
      valorCaixa = combo.preco*mult;
    } else {
      const sabor = el.querySelector("#venda-sabor").value;
      const qtd = parseInt(el.querySelector("#venda-qtd").value) || 0;
      if (qtd <= 0) return;
      qtdTotalCookies = qtd;
      entradaVenda = { id: Date.now()+Math.random(), data: isoParaBR(dataISO), dataISO, sabor, qtd };
      descricaoCaixa = `${qtd}x ${nomesSabor[sabor]||sabor}`;
      valorCaixa = (parseFloat(precosVenda[sabor])||0) * qtd;   // mesmo valor que será congelado na venda
    }

    const cookiesUsados = {};
    if (modoVenda === "combo"){
      entradaVenda.itens.forEach(it=>{
        cookiesUsados[it.saborId] = (cookiesUsados[it.saborId]||0) + it.qtd * entradaVenda.multiplicador;
      });
    } else {
      cookiesUsados[entradaVenda.sabor] = entradaVenda.qtd;
    }
    const faltaAssado = Object.entries(cookiesUsados)
      .filter(([sid,q])=> saldoDe("assados", sid) < q)
      .map(([sid,q])=> `${NOME_SABOR[sid]||sid}: tem ${saldoDe("assados", sid)}, a venda precisa de ${q}`);
    const embalagensUsadas = {};
    itensExtras.forEach(it=>{
      if (it.porCookie) embalagensUsadas[it.nome] = qtdTotalCookies;
    });
    el.querySelectorAll(".venda-extra-manual").forEach(inp=>{
      const v = parseFloat(inp.value);
      if (!isNaN(v) && v > 0) embalagensUsadas[inp.dataset.nome] = v;
    });
    const faltaEmb = Object.entries(embalagensUsadas)
      .filter(([nome, usado])=> (parseFloat(estoque[nome]) || 0) < usado)
      .map(([nome, usado])=> `${nome}: tem ${fmtNum(parseFloat(estoque[nome]) || 0)}, a venda usa ${fmtNum(usado)}`);
    if ((faltaAssado.length || faltaEmb.length) && !confirm(
      (faltaAssado.length ? "Não tem cookies assados suficientes:\n" + faltaAssado.join("\n") + "\n\nRegistre a fornada em Produção antes.\n\n" : "") +
      (faltaEmb.length ? "Não tem embalagem suficiente:\n" + faltaEmb.join("\n") + "\n\nRegistre a compra na aba Comprar antes.\n\n" : "") +
      "Registrar a venda mesmo assim? O saldo ficará negativo.")) return;
    Object.entries(cookiesUsados).forEach(([sid,q])=> somaSaldo("assados", sid, -q));
    saveSaldoCookies(saldoCookies);
    entradaVenda.cookiesUsados = cookiesUsados;

    Object.entries(embalagensUsadas).forEach(([nome, usado])=>{
      const atual = parseFloat(estoque[nome]) || 0;
      estoque[nome] = String(Math.round((atual - usado) * 100) / 100);   // pode ficar negativo de propósito
    });
    saveStock(estoque);

    entradaVenda.embalagensUsadas = embalagensUsadas;
    congelarVenda(entradaVenda, false);   // guarda o valor e o custo desta venda como estão agora
    historicoVendas.push(entradaVenda);
    saveVendas(historicoVendas);

    if (el.querySelector("#venda-lancar-caixa").checked){
      historicoCaixa.push({
        id: Date.now()+Math.random(),
        data: isoParaBR(dataISO), dataISO,
        tipo: "entrada", categoria: "venda", valor: valorCaixa,
        descricao: descricaoCaixa,
        vendaId: entradaVenda.id
      });
      saveCaixa(historicoCaixa);
    }

    el.querySelector("#venda-qtd").value = "";
    const multInp = el.querySelector("#venda-combo-mult"); if (multInp) multInp.value = "1";
    el.querySelectorAll(".venda-extra-manual").forEach(inp=> inp.value = "");
    renderVendas();
  });

  el.querySelectorAll(".rm-venda").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = parseFloat(btn.dataset.id);
      const v = historicoVendas.find(x=>x.id===id);
      if (!v) return;
      const ligadas = caixaDaVenda(id);
      const msgVenda = "Excluir essa venda? As embalagens e os cookies assados voltam para o estoque." + (ligadas.length

        : " Se essa venda foi lançada no Caixa numa versão antiga do app, o dinheiro dela NÃO sai sozinho: apague a entrada na aba Caixa.");
      if (!confirm(msgVenda)) return;
      if (v.embalagensUsadas){
        Object.entries(v.embalagensUsadas).forEach(([nome, usado])=>{
          const atual = parseFloat(estoque[nome]) || 0;
          estoque[nome] = String(atual + usado);
        });
        saveStock(estoque);
      }
      if (v.cookiesUsados){
        Object.entries(v.cookiesUsados).forEach(([sid,q])=> somaSaldo("assados", sid, q));
        saveSaldoCookies(saldoCookies);
      }
      historicoVendas = historicoVendas.filter(x=>x.id!==id);
      saveVendas(historicoVendas);
      if (ligadas.length){
        historicoCaixa = historicoCaixa.filter(x=>x.vendaId !== id);
        saveCaixa(historicoCaixa);
      }
      renderVendas();
    });
  });
}

const CAIXA_KEY = "casaruth_caixa";

    const list = JSON.parse(localStorage.getItem(CAIXA_KEY)||"[]");
    list.forEach(l=>{ if (!l.id) l.id = Date.now()+Math.random(); });
    return list;
  }catch(e){return [];}
}
function saveCaixa(list){ try{ localStorage.setItem(CAIXA_KEY, JSON.stringify(list)); }catch(e){} marcarAlterado(); }
let historicoCaixa = loadCaixa();

function caixaDaVenda(vendaId){ return historicoCaixa.filter(l=>l.vendaId === vendaId); }

const CATEGORIAS_ENTRADA = {venda:"Venda de cookies", aporte:"Aporte/empréstimo dos sócios", outro:"Outra entrada"};
const CATEGORIAS_SAIDA = {compra:"Compra de ingrediente/embalagem", conta:"Conta fixa (aluguel, salário...)", devolucao:"Devolução de aporte aos sócios", outro:"Outra saída"};

function saldoCaixa(){
  return historicoCaixa.reduce((s,l)=> s + (l.tipo==="entrada" ? l.valor : -l.valor), 0);
}
function saldoDevidoSocios(){
  let devido = 0;
  historicoCaixa.forEach(l=>{
    if (l.tipo==="entrada" && l.categoria==="aporte") devido += l.valor;
    if (l.tipo==="saida" && l.categoria==="devolucao") devido -= l.valor;
  });
  return devido;
}

      ${devido > 0 ? `<p style="font-size:0.85rem; opacity:0.75; margin-top:0.5rem;">A empresa ainda deve R$ ${devido.toFixed(2)} de aportes que entraram e ainda não voltaram.</p>` : ""}

        <button id="caixa-salvar" style="border:1px solid var(--wine); background:var(--wine); color:var(--cream); border-radius:6px; padding:0.5rem; cursor:pointer;">Registrar</button>
      </div>
    </div>
    <div class="recipe">
      <h2>Últimos movimentos</h2>
      <table><thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th class="price">Valor</th><th></th></tr></thead>
      <tbody>${historico || `<tr><td colspan="5" style="opacity:0.6;">Nenhum movimento registrado ainda</td></tr>`}</tbody></table>
    </div>
  `;

  let tipoAtual = "entrada";
  const selectCat = el.querySelector("#caixa-categoria");
  const contaSel = el.querySelector("#caixa-conta");
  if (contaSel) contaSel.addEventListener("change", ()=>{
