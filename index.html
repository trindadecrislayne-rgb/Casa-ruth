    if (!x) return;
    selectCat.value = "conta";
    const campoValor = el.querySelector("#caixa-valor");
    if (!campoValor.value) campoValor.value = x.c.valor;
    const campoDesc = el.querySelector("#caixa-descricao");
    if (!campoDesc.value) campoDesc.value = `Conta: ${x.c.nome}`;
  });
  el.querySelectorAll(".caixa-tipo-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      tipoAtual = btn.dataset.tipo;
      el.querySelectorAll(".caixa-tipo-btn").forEach(b=>{
        const ativo = b===btn;
        b.style.background = ativo ? (tipoAtual==="entrada" ? "#3F7D4F" : "var(--wine)") : "transparent";
        b.style.color = ativo ? "#fff" : (b.dataset.tipo==="entrada" ? "#3F7D4F" : "var(--wine)");
      });
      const cats = tipoAtual==="entrada" ? CATEGORIAS_ENTRADA : CATEGORIAS_SAIDA;
      selectCat.innerHTML = Object.entries(cats).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
      if (contaSel){ contaSel.style.display = tipoAtual === "saida" ? "" : "none"; if (tipoAtual !== "saida") contaSel.value = ""; }
    });
  });

  el.querySelector("#caixa-salvar").addEventListener("click", ()=>{
    const valor = parseFloat(el.querySelector("#caixa-valor").value);
    if (isNaN(valor) || valor <= 0) return;
    const categoria = selectCat.value;
    const descricao = el.querySelector("#caixa-descricao").value.trim();
    const dataISO = el.querySelector("#caixa-data").value || hojeISO();
    const escolhida = (tipoAtual === "saida" && contaSel && contaSel.value !== "") ? contasAbertas[parseInt(contaSel.value, 10)] : null;
    const novoId = Date.now()+Math.random();
    const mov = {
      id: novoId,
      data: isoParaBR(dataISO), dataISO,
      tipo: tipoAtual, categoria: escolhida ? "conta" : categoria, valor,
      descricao: descricao || (escolhida ? `Conta: ${escolhida.c.nome} (${escolhida.mes})` : "")
    };
    if (escolhida){
      mov.contaChave = escolhida.c.chave;
      mov.contaMes = escolhida.mes;
      registroMes(escolhida.mes).pagos[escolhida.c.chave] = { valor, dataISO, caixaId: novoId };   // marca a conta como paga
      saveContas(contasData);
    }
    historicoCaixa.push(mov);
    saveCaixa(historicoCaixa);
    renderCaixa();
  });

  el.querySelectorAll(".rm-caixa").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id = parseFloat(btn.dataset.id);
      const removido = historicoCaixa.find(x=>x.id===id);
      if (!confirm(removido && removido.compraId ? "Esse movimento veio de uma compra. Excluir aqui NÃO desfaz o estoque nem o custo (para isso use Desfazer na aba Comprar). Excluir mesmo assim?" : "Excluir esse movimento?")) return;
      if (removido && removido.contaChave){
        const reg = contasData.meses[removido.contaMes];
        if (reg && reg.pagos){ delete reg.pagos[removido.contaChave]; saveContas(contasData); }
      }
      historicoCaixa = historicoCaixa.filter(x=>x.id!==id);
      saveCaixa(historicoCaixa);
      renderCaixa();
    });
  });
}

// ---- Lucro real: valor e custo ficam "congelados" na venda ----
// <lucro-logica>
// Custo do cookie só com massa + recheio (sem embalagem; a embalagem é contada à parte, pelo que foi usado na venda)
function custoSemEmbalagemDoSabor(s){
  const c = custoPorCookieDoSabor(s);
  return c === null ? null : c - custoEmbalagemPorCookie();
}
function cookiesDaVenda(v){
  const r = {};
  if (v.tipo === "combo") (v.itens || []).forEach(it=>{ r[it.saborId] = (r[it.saborId] || 0) + it.qtd * (v.multiplicador || 1); });
  else r[v.sabor] = v.qtd;
  return r;
}
// Custo com os preços de AGORA. ing = null quando falta preço de algum ingrediente.
function calcularCustoVenda(v){
  let ing = 0;
  Object.entries(cookiesDaVenda(v)).forEach(([sid, q])=>{
    const s = sabores.find(x=>x.id === sid);
    const c = s ? custoSemEmbalagemDoSabor(s) : null;
    if (c === null || ing === null) ing = null; else ing += c * q;
  });
  let emb = 0, embIncompleta = false;
  Object.entries(v.embalagensUsadas || {}).forEach(([nome, usado])=>{
    const it = itensExtras.find(x=>x.nome === nome);
    const p = it ? parseFloat(it.precoUnitario) : NaN;
    if (isNaN(p)) { if (usado > 0) embIncompleta = true; } else emb += p * usado;
  });
  return { ing, emb, embIncompleta };
}
// Grava valor e custo dentro da venda. estimado=true: venda antiga (usa o preço de hoje). Devolve true se mudou algo.
function congelarVenda(v, estimado){
  let mudou = false;
  if (typeof v.valor !== "number" && v.tipo !== "combo"){
    const p = parseFloat(precosVenda[v.sabor]);
    if (!isNaN(p) || !estimado){ v.valor = (p || 0) * v.qtd; if (estimado) v.estimado = true; mudou = true; }
  }
  if (typeof v.custoIng !== "number" || v.custoIncompleto){
    const c = calcularCustoVenda(v);
    if (c.ing !== null){
      const igual = v.custoIng === c.ing && v.custoEmb === c.emb && !!v.custoIncompleto === c.embIncompleta;
      if (!igual){ v.custoIng = c.ing; v.custoEmb = c.emb; v.custoIncompleto = c.embIncompleta; if (estimado) v.estimado = true; mudou = true; }
    }
  }
  return mudou;
}
function congelarVendasAntigas(){
  let mudou = false;
  historicoVendas.forEach(v=>{ if (congelarVenda(v, true)) mudou = true; });
  if (mudou) saveVendas(historicoVendas);
  return mudou;
}
// Valor da venda: o congelado; se a venda ainda não foi congelada, cai no preço de hoje
function valorDaVenda(v){
  if (typeof v.valor === "number") return v.valor;
  return (parseFloat(precosVenda[v.sabor]) || 0) * (v.qtd || 0);
}
// </lucro-logica>

// ---- Compras: soma no estoque, refaz o custo médio e lança a saída no Caixa ----
// <compras-logica>
const COMPRAS_KEY = "casaruth_compras";
function loadCompras(){ try{ const l = JSON.parse(localStorage.getItem(COMPRAS_KEY)||"[]"); return Array.isArray(l) ? l : []; }catch(e){ return []; } }
function saveCompras(l){ try{ localStorage.setItem(COMPRAS_KEY, JSON.stringify(l)); }catch(e){} marcarAlterado(); }
let historicoCompras = loadCompras();

function arred(n, c){ const f = Math.pow(10, c); return Math.round(n*f)/f; }
function fmtNum(n){ return (Math.round(n*100)/100).toLocaleString("pt-BR"); }
function brl(n){ return "R$ " + n.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2}); }
function brlUn(n){ return "R$ " + n.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:4}); }

// Que tipo de item é: ingrediente em gramas, ingrediente em unidades (ovo) ou embalagem (unidades)
function infoItemCompra(nome){
  const extra = itensExtras.find(it=>it.nome===nome);
  if (extra) return { tipo:"extra", un:"un", extra };
  const ing = todosIngredientesUnicos().find(i=>i.n===nome);
  if (ing) return { tipo:"ing", un: ing.unidade==="un" ? "un" : "g", ing };
  return null;
}
// Custo atual por grama (ou por unidade). null = ainda não existe preço.
function custoAtualUnit(nome){
  const info = infoItemCompra(nome);
  if (!info) return null;
  if (info.tipo === "extra"){
    const p = parseFloat(info.extra.precoUnitario);
    return (isNaN(p) || p <= 0) ? null : p;
  }
  const d = precos[nome];
  if (!d) return null;
  const tam = parseFloat(info.un === "g" ? (d.tam ?? info.ing.tamTipico) : d.tam);
  const pr = parseFloat(d.preco);
  if (isNaN(tam) || isNaN(pr) || tam <= 0 || pr <= 0) return null;
  return pr / tam;
}
// Só calcula (não grava nada). qtd em gramas ou unidades. valor 0 = só estoque, custo não muda.
function calcularCompraItem(nome, qtd, valor){
  const estAntes = parseFloat(estoque[nome]) || 0;        // estoque de verdade (pode estar negativo)
  const sobra = Math.max(0, estAntes);                    // só o que existe de fato entra na média do custo
  const custoAntes = custoAtualUnit(nome);
  const estDepois = arred(estAntes + qtd, 2);
  const baseDepois = arred(sobra + qtd, 2);
  let custoDepois = custoAntes, valorTotalDepois = null;
  if (valor > 0){
    const valorSobra = custoAntes === null ? 0 : sobra * custoAntes;   // quanto vale o que sobrou
    valorTotalDepois = valorSobra + valor;                              // + o que acabei de pagar
    custoDepois = valorTotalDepois / baseDepois;                        // ÷ quantidade total
  }
  return { estAntes, estDepois, baseDepois, custoAntes, custoDepois, valorTotalDepois };
}
// Grava no estoque e no preço. Devolve o "antes" para poder desfazer.
function aplicarCompraItem(nome, qtd, valor){
  const info = infoItemCompra(nome);
  const r = calcularCompraItem(nome, qtd, valor);
  const antes = {
    estoque: estoque[nome] === undefined ? null : estoque[nome],
    precos: precos[nome] ? JSON.parse(JSON.stringify(precos[nome])) : null,
    precoUnitario: info.tipo === "extra" ? info.extra.precoUnitario : null
  };
  estoque[nome] = String(r.estDepois);
  if (valor > 0){
    if (info.tipo === "extra") info.extra.precoUnitario = r.custoDepois.toFixed(4);
    else precos[nome] = { tam: String(r.baseDepois), preco: String(arred(r.valorTotalDepois, 2)) };
  }
  return antes;
}
// Itens negativos (descontou mais do que tinha) e zerados
function itensEmFalta(){
  const itens = todosIngredientesUnicos().map(i=>({nome:i.n, un: i.unidade === "un" ? "un" : "g"}))
    .concat(itensExtras.map(it=>({nome:it.nome, un:"un"})));
  const lista = [];
  itens.forEach(x=>{
    if (estoque[x.nome] === undefined || estoque[x.nome] === "") return;   // nunca cadastrado: não é falta
    const q = parseFloat(estoque[x.nome]);
    if (isNaN(q)) return;
    if (q < 0) lista.push({ ...x, qtd:q, tipo:"negativo" });
    else if (q === 0) lista.push({ ...x, qtd:q, tipo:"zerado" });
  });
  return lista;
}
function cartaoEstoqueEmFalta(){
  const f = itensEmFalta();
  if (!f.length) return "";
  const neg = f.filter(x=>x.tipo === "negativo"), zer = f.filter(x=>x.tipo === "zerado");
  return `<div class="recipe" style="border-color:var(--wine);">
    <h2>Atenção no estoque</h2>
    ${neg.length ? `<p style="font-size:0.9rem; color:var(--wine);"><b>Negativo:</b> ${neg.map(x=>`${esc(x.nome)} (${fmtQtdCompra(x.un, x.qtd)})`).join(", ")}.</p>
    <p style="font-size:0.82rem; opacity:0.8; margin-top:0.3rem;">Negativo quer dizer que o app descontou mais do que você disse que tinha. Ou faltou registrar uma compra, ou a contagem está desatualizada. Registre a compra em Comprar ou digite a contagem real abaixo.</p>` : ""}
    ${zer.length ? `<p style="font-size:0.9rem; margin-top:0.4rem;"><b>Zerado:</b> ${zer.map(x=>esc(x.nome)).join(", ")}.</p>` : ""}
  </div>`;
}
function fmtQtdCompra(un, qtd){
  if (un === "g") return Math.abs(qtd) >= 1000 ? `${fmtNum(qtd/1000)} kg` : `${fmtNum(qtd)} g`;
  return `${fmtNum(qtd)} un`;
}
function descricaoCompra(c){
  if (c.itens.length === 1) return `Compra: ${c.itens[0].nome} (${fmtQtdCompra(c.itens[0].un, c.itens[0].qtd)})`;
  return `Compra (${c.itens.length} itens): ` + c.itens.slice(0,3).map(i=>i.nome).join(", ") + (c.itens.length > 3 ? "..." : "");
}
// itens: [{nome, qtd, valor}] — qtd em gramas ou unidades.
function registrarCompra({itens, dataISO, lancarCaixa, origem}){
  const lista = itens.filter(it=> infoItemCompra(it.nome) && it.qtd > 0);
  if (!lista.length) return null;
  const id = Date.now() + Math.random();
  const data = dataISO || hojeISO();
  const dados = lista.map(it=>{
    const valor = it.valor > 0 ? it.valor : 0;
    const antes = aplicarCompraItem(it.nome, it.qtd, valor);
    return { nome: it.nome, qtd: it.qtd, valor, un: infoItemCompra(it.nome).un, antes };
  });
  const total = arred(dados.reduce((s,d)=> s + d.valor, 0), 2);
  const compra = { id, dataISO: data, data: isoParaBR(data), itens: dados, total, origem: origem || "manual" };
  if (lancarCaixa && total > 0){
    const cid = Date.now() + Math.random();
    historicoCaixa.push({ id: cid, data: isoParaBR(data), dataISO: data, tipo:"saida", categoria:"compra", valor: total, descricao: descricaoCompra(compra), compraId: id });
    compra.caixaId = cid;
    saveCaixa(historicoCaixa);
  }
  historicoCompras.push(compra);
  saveCompras(historicoCompras);
  saveStock(estoque); savePrecos(precos); saveExtras(itensExtras);
  return compra;
}
// Desfaz: tira do estoque, volta o custo (se não houve compra depois) e apaga a saída do Caixa.
function desfazerCompra(id){
  const idx = historicoCompras.findIndex(c=> c.id === id);
  if (idx < 0) return { ok:false, avisos:[] };
  const c = historicoCompras[idx];
  const avisos = [];
  c.itens.forEach(d=>{
    const info = infoItemCompra(d.nome);
    if (!info) return;   // item foi removido do app: nada a desfazer
    const atual = parseFloat(estoque[d.nome]) || 0;
    estoque[d.nome] = String(arred(atual - d.qtd, 2));
    if (!(d.valor > 0)) return;
    const houveDepois = historicoCompras.slice(idx+1).some(x=> x.itens.some(y=> y.nome === d.nome && y.valor > 0));
    if (houveDepois){ avisos.push(d.nome); return; }
    if (info.tipo === "extra") info.extra.precoUnitario = d.antes.precoUnitario ?? "";
    else if (d.antes.precos) precos[d.nome] = d.antes.precos;
    else delete precos[d.nome];
  });
  if (c.caixaId){
    historicoCaixa = historicoCaixa.filter(x=> x.id !== c.caixaId);
    saveCaixa(historicoCaixa);
  }
  historicoCompras.splice(idx, 1);
  saveCompras(historicoCompras);
  saveStock(estoque); savePrecos(precos); saveExtras(itensExtras);
  return { ok:true, avisos };
}
// </compras-logica>

const CP_INPUT = "padding:0.5rem; border-radius:12px; border:1px solid var(--gold); background:transparent; color:var(--ink); font-family:inherit; width:100%; box-sizing:border-box;";
function opcoesUnidadeCompra(nome){
  const info = infoItemCompra(nome);
  if (!info) return [];
  if (info.un === "g") return [{v:"kg", t:"kg", f:1000}, {v:"g", t:"g", f:1}];
  if (info.tipo === "ing") return [{v:"un", t:"un", f:1}, {v:"duzia", t:"dúzia", f:12}];
  return [{v:"un", t:"un", f:1}];
}

// Último preço pago por item (olhando as compras registradas). Devolve valor por grama ou por unidade.
function ultimoPrecoPago(nome){
  for (let i = historicoCompras.length - 1; i >= 0; i--){
    const d = (historicoCompras[i].itens || []).find(x=> x.nome === nome && x.valor > 0 && x.qtd > 0);
    if (d) return d.valor / d.qtd;
  }
  return null;
}
// Cartão com o preço de cada item: é aqui que mora o preço (a média é refeita a cada compra)
function cartaoPrecosItens(){
  const nomes = todosIngredientesUnicos().map(i=>i.n).concat(itensExtras.map(it=>it.nome));
  const linhas = nomes.map(nome=>{
    const info = infoItemCompra(nome);
    if (!info) return "";
    const porKg = info.un === "g";
    const fmt = n => porKg ? brl(n * 1000) + "/kg" : brlUn(n) + "/un";
    const c = custoAtualUnit(nome), u = ultimoPrecoPago(nome);
    return `<tr>
      <td>${esc(nome)}</td>
      <td class="price" style="text-align:right;">${c === null ? `<span style="color:var(--wine);">sem preço</span>` : fmt(c)}</td>
      <td class="price" style="text-align:right;">${u === null ? "—" : fmt(u)}</td>
      <td style="text-align:right;"><button class="btn-sec cp-corrigir" data-nome="${esc(nome)}" type="button" style="padding:0.2rem 0.55rem; font-size:0.78rem;">Corrigir</button></td>
    </tr>`;
  }).join("");
  return `<div class="recipe">
    <h2>Preço de cada item</h2>
    <div class="sub">Custo médio: o app refaz a cada compra, juntando o que ainda tem no estoque com o que você acabou de pagar. Este é o único lugar dos preços.</div>
    <table class="tabela-real" style="margin-top:0.5rem;"><thead><tr><th>Item</th><th class="price" style="text-align:right;">Custo médio</th><th class="price" style="text-align:right;">Último pago</th><th></th></tr></thead><tbody>${linhas}</tbody></table>
  </div>`;
}
function lerValorDigitado(txt){
  let t = String(txt).trim().replace(/^R\$\s*/i, "");
  if (t.includes(",")) t = t.replace(/\./g, "").replace(",", ".");
  return parseFloat(t);
}

    <div class="recipe">
      <h2>Últimas compras</h2>
      ${ultimas.length ? `<div class="contas-grid" style="margin-top:0.6rem;">${ultimas.map(c=>`
        <div class="conta-card">
          <div class="conta-topo"><span class="conta-nome">${esc(c.data)}</span><span class="selo selo-pend">${c.total > 0 ? brl(c.total) : "sem valor"}</span></div>
          <div style="font-size:0.85rem; line-height:1.4;">${c.itens.map(d=>`${esc(d.nome)} · ${fmtQtdCompra(d.un, d.qtd)}${d.valor > 0 ? " · " + brl(d.valor) : ""}`).join("<br>")}</div>

  const qtdEl = el.querySelector("#cp-qtd"), valEl = el.querySelector("#cp-valor");

  function lerForm(){
    const nome = sel.value;
    const op = opcoesUnidadeCompra(nome).find(o=>o.v === selUn.value);
    const qtdDigitada = parseFloat(qtdEl.value);
    const valor = parseFloat(valEl.value);
    const qtdBase = (op && qtdDigitada > 0) ? qtdDigitada * op.f : NaN;
    return { nome, op, qtdBase, valor: (valor > 0 ? valor : 0) };
  }
  function trocouItem(){
    selUn.innerHTML = opcoesUnidadeCompra(sel.value).map(o=>`<option value="${o.v}">${o.t}</option>`).join("");
    atualizarPrevia();
  }
  function atualizarPrevia(){
    erro.textContent = "";
    const f = lerForm();
    const info = infoItemCompra(f.nome);
    if (!info || !(f.qtdBase > 0)){
      previa.innerHTML = `<span style="opacity:0.7;">Preencha a quantidade e o valor pago para ver o novo custo.</span>`;
      return;
    }
    const r = calcularCompraItem(f.nome, f.qtdBase, f.valor);
    const porKg = info.un === "g";
    const fatorC = porKg ? 1000 : 1, unC = porKg ? "kg" : "un";
    const fmtC = n => porKg ? brl(n * fatorC) : brlUn(n);
    let h = `Você está comprando <b>${fmtQtdCompra(info.un, f.qtdBase)}</b>. Estoque: ${fmtQtdCompra(info.un, r.estAntes)} → <b>${fmtQtdCompra(info.un, r.estDepois)}</b>.`;
    if (r.estAntes < 0) h += `<br><span style="color:var(--wine);">O estoque estava negativo: parte desta compra cobre o que já foi usado.</span>`;
    if (f.valor > 0){
      h += `<br>Preço desta compra: ${fmtC(f.valor / f.qtdBase)}/${unC}.`;
      h += `<br>Custo médio: ${r.custoAntes === null ? "sem preço antes" : fmtC(r.custoAntes) + "/" + unC} → <b>${fmtC(r.custoDepois)}/${unC}</b>.`;
      if (r.custoAntes !== null){
        const razao = (f.valor / f.qtdBase) / r.custoAntes;
        if (razao > 2 || razao < 0.5) h += `<br><span style="color:var(--wine);">Atenção: o preço está muito diferente do custo atual. Confira a quantidade e o valor.</span>`;
      }
    } else {
      h += `<br><span style="opacity:0.75;">Sem valor pago: soma só no estoque, o custo não muda.</span>`;
    }
    previa.innerHTML = h;
  }
  el.querySelectorAll(".cp-corrigir").forEach(b=>{
    b.addEventListener("click", ()=>{
      const nome = b.dataset.nome;
      const info = infoItemCompra(nome);
      if (!info) return;
      const porKg = info.un === "g";
      const txt = prompt(`Quanto está custando "${nome}" agora? Digite o preço por ${porKg ? "kg" : "unidade"} (ex.: 12,50).\nIsso corrige o custo médio; as próximas compras continuam a média a partir desse valor.`);
      if (txt === null) return;
      const v = lerValorDigitado(txt);
      if (!(v > 0)){ alert("Digite um valor maior que zero, por exemplo 12,50."); return; }
      if (info.tipo === "extra"){
        info.extra.precoUnitario = v.toFixed(4);
        saveExtras(itensExtras);
      } else {
        precos[nome] = porKg ? { tam: "1000", preco: String(arred(v, 2)) } : { tam: "1", preco: String(arred(v, 4)) };
        savePrecos(precos);
      }
      renderComprar(`Custo de <b>${esc(nome)}</b> corrigido para ${porKg ? brl(v) + "/kg" : brlUn(v) + "/un"}.`);
    });
  });
  sel.addEventListener("change", trocouItem);
  [selUn, qtdEl, valEl].forEach(x=> x.addEventListener("input", atualizarPrevia));
  selUn.addEventListener("change", atualizarPrevia);
  trocouItem();

  el.querySelector("#cp-salvar").addEventListener("click", ()=>{
    const f = lerForm();
    const info = infoItemCompra(f.nome);
    if (!info){ erro.textContent = "Escolha o item."; return; }
    if (!(f.qtdBase > 0)){ erro.textContent = "Digite a quantidade comprada."; return; }
    if (!(f.valor > 0)){ erro.textContent = "Digite o valor pago. Sem ele o app não consegue refazer o custo."; return; }
    if (info.un === "g" && f.qtdBase > 50000 && !confirm(`Você digitou ${fmtQtdCompra("g", f.qtdBase)}. Está certo?`)) return;
    const r = calcularCompraItem(f.nome, f.qtdBase, f.valor);
    if (r.custoAntes !== null){
      const razao = (f.valor / f.qtdBase) / r.custoAntes;
      if ((razao > 2 || razao < 0.5) && !confirm("O preço desta compra está muito diferente do custo atual. Registrar mesmo assim?")) return;
    }
    const dataISO = el.querySelector("#cp-data").value || hojeISO();
    registrarCompra({ itens:[{nome:f.nome, qtd:f.qtdBase, valor:f.valor}], dataISO, lancarCaixa: el.querySelector("#cp-caixa").checked, origem:"manual" });
    const porKg = info.un === "g";
    const custoTxt = porKg ? `${brl(r.custoDepois * 1000)}/kg` : `${brlUn(r.custoDepois)}/un`;
    const caixaTxt = el.querySelector("#cp-caixa").checked ? ` Saída de ${brl(f.valor)} lançada no Caixa.` : "";
    render();   // refaz a aba Receitas com o custo novo
    renderComprar(`Compra registrada: ${esc(f.nome)}, ${fmtQtdCompra(info.un, f.qtdBase)}. Estoque agora ${fmtQtdCompra(info.un, r.estDepois)}; custo médio ${custoTxt}.${caixaTxt}`);
  });

  el.querySelectorAll(".cp-desfazer").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const c = historicoCompras.find(x=> String(x.id) === btn.dataset.id);
      if (!c) return;
      if (!confirm("Desfazer esta compra? Vai tirar do estoque, voltar o custo e apagar a saída do Caixa.")) return;
      const r = desfazerCompra(c.id);
      render();
      const av = r.avisos.length ? ` O custo médio de ${r.avisos.map(esc).join(", ")} não foi refeito porque houve outra compra depois; só o estoque foi ajustado.` : "";
      renderComprar(`Compra desfeita.${av}`);
    });
  });

  setupNota();
}

// ---- Backup: exportar / restaurar tudo ----
const ULTIMO_BACKUP_KEY = "casaruth_ultimo_backup";
// <backup-logica>
function gerarBackupTexto(){
  const dados = {};
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (k && k.startsWith("casaruth_") && k !== "casaruth_ultimo_backup") dados[k] = localStorage.getItem(k);
  }
  return JSON.stringify({ app:"casaruth", versao:1, criadoEm:new Date().toISOString(), dados }, null, 1);
}
// devolve { ok:true } ou { ok:false, erro } — só escreve se o conteúdo for válido
function aplicarBackupTexto(texto){
  let obj;
  try{ obj = JSON.parse(texto); }catch(e){ return { ok:false, erro:"O texto não é um backup válido." }; }
  if (!obj || obj.app !== "casaruth" || !obj.dados || typeof obj.dados !== "object")
    return { ok:false, erro:"Esse conteúdo não parece um backup da Casa Ruth." };
  const chaves = Object.keys(obj.dados).filter(k=>k.startsWith("casaruth_"));
  if (!chaves.length) return { ok:false, erro:"O backup está vazio." };
  const antigas = [];
  for (let i = 0; i < localStorage.length; i++){
    const k = localStorage.key(i);
    if (k && k.startsWith("casaruth_")) antigas.push(k);
  }
  antigas.forEach(k=> localStorage.removeItem(k));          // restaurar = substituir, sem misturar
  chaves.forEach(k=> localStorage.setItem(k, obj.dados[k]));
  return { ok:true, itens:chaves.length };
}
// </backup-logica>

function ultimoBackupTexto(){
  let v = null; try{ v = localStorage.getItem(ULTIMO_BACKUP_KEY); }catch(e){}
  return v ? `Último backup: ${isoParaBR(v)}` : "Você ainda não fez nenhum backup.";
}
function avisoBackupPainel(){
  if (!(historicoVendas.length || historicoCaixa.length || historicoProducao.length || historicoMoldados.length)) return "";
  let v = null; try{ v = localStorage.getItem(ULTIMO_BACKUP_KEY); }catch(e){}
  if (v){
    const dias = (Date.now() - new Date(v + "T12:00:00").getTime()) / 86400000;
    if (dias < 7) return "";
  }
  return `
    <div class="recipe" style="display:flex; align-items:center; gap:0.7rem; flex-wrap:wrap;">
      <div style="font-size:0.9rem; flex:1; min-width:200px;">${v ? "Faz mais de uma semana desde o último backup." : "Você ainda não fez backup dos seus dados."}</div>
      <button class="btn-sec" onclick="irPara('config')">Fazer backup</button>
    </div>`;
}
function ligarBackup(el){
  const msg = el.querySelector("#bk-msg");
  const aviso = (t, erro)=>{ msg.style.color = erro ? "var(--wine)" : ""; msg.textContent = t; };
  const marcar = ()=>{ try{ localStorage.setItem(ULTIMO_BACKUP_KEY, hojeISO()); }catch(e){} };

  el.querySelector("#bk-baixar").addEventListener("click", ()=>{
    try{
      const blob = new Blob([gerarBackupTexto()], { type:"application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `backup-casa-ruth-${hojeISO()}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(a.href), 3000);
      marcar();
      aviso("Backup baixado. Guarde o arquivo num lugar seguro (Drive, WhatsApp para você mesmo...). Se o download não começar, use “Copiar backup”.");
    }catch(e){ aviso("Não consegui baixar aqui. Use “Copiar backup”.", true); }
  });

  el.querySelector("#bk-copiar").addEventListener("click", async ()=>{
    const texto = gerarBackupTexto();
    try{
      await navigator.clipboard.writeText(texto);
    }catch(e){
      const ta = el.querySelector("#bk-texto");
      ta.value = texto; ta.focus(); ta.select();
      try{ document.execCommand("copy"); }catch(_){}
      aviso("Texto do backup colocado na caixa abaixo: copie e guarde em um lugar seguro (por exemplo, em uma nota).");
      marcar();
      return;
    }
    marcar();
    aviso("Backup copiado. Cole em uma nota, e-mail ou mensagem para você mesmo.");
  });

  function restaurar(texto){
    if (!confirm("Restaurar vai SUBSTITUIR todos os dados atuais pelos do backup. Continuar?")) return;
    const r = aplicarBackupTexto(texto);
    if (!r.ok){ aviso(r.erro, true); return; }
    (async ()=>{
      if (dbRef){ try{ await dbRef.doc("estado/casaruth").set({}); }catch(e){} }   // evita a nuvem antiga sobrescrever o backup
      location.reload();
    })();
  }
  el.querySelector("#bk-arquivo-btn").addEventListener("click", ()=> el.querySelector("#bk-arquivo").click());
  el.querySelector("#bk-arquivo").addEventListener("change", e=>{
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = ()=> restaurar(String(rd.result));
    rd.onerror = ()=> aviso("Não consegui ler o arquivo.", true);
    rd.readAsText(f);
  });
  el.querySelector("#bk-colar").addEventListener("click", ()=>{
    const t = el.querySelector("#bk-texto").value.trim();
    if (!t){ aviso("Cole primeiro o texto do backup na caixa.", true); return; }
    restaurar(t);
  });
}

// ---- Contas do mês: o que ainda precisa pagar x dinheiro realmente livre ----
// <contas-logica>
const CONTAS_KEY = "casaruth_contas";
function loadContas(){
  try{
    const d = JSON.parse(localStorage.getItem(CONTAS_KEY) || "null");
    if (d && typeof d === "object") return { meses: d.meses || {}, venc: d.venc || {} };
  }catch(e){}
  return { meses:{}, venc:{} };
}
function saveContas(d){ try{ localStorage.setItem(CONTAS_KEY, JSON.stringify(d)); }catch(e){} marcarAlterado(); }
let contasData = loadContas();
let contasMesVisto = null;   // null = mês atual

const NOMES_FIXOS = { salarioCris:"Salário da Cris", aluguel:"Aluguel", agua:"Água", internet:"Internet" };
const MESES_PT = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function nomeMes(mes){ const [y,m] = mes.split("-"); return `${MESES_PT[parseInt(m,10)-1]} de ${y}`; }
function somaMes(mes, delta){
  let [y,m] = mes.split("-").map(Number); m += delta;
  while (m < 1){ m += 12; y--; }
  while (m > 12){ m -= 12; y++; }
  return `${y}-${String(m).padStart(2,"0")}`;
}

// grava o mês só quando alguém altera algo (só olhar não cria registro)
function registroMes(mes){
  if (!contasData.meses[mes]) contasData.meses[mes] = { pagos:{}, ajustes:{}, avulsas:[] };
  const r = contasData.meses[mes];
  r.pagos = r.pagos || {}; r.ajustes = r.ajustes || {}; r.avulsas = r.avulsas || [];
  return r;
}

// monta a lista de contas de um mês: custos fixos de Config + contas avulsas daquele mês
function contasDoMes(mes){
  const r = contasData.meses[mes] || {};
  const pagos = r.pagos || {}, ajustes = r.ajustes || {}, avulsas = r.avulsas || [];
  const lista = [];
  function valorDe(chave, base){
    const aj = ajustes[chave];
    return (aj !== undefined && aj !== "") ? (parseFloat(aj) || 0) : base;
  }
  function entra(chave, nome, base){
    const valor = valorDe(chave, base);
    if (valor > 0 || pagos[chave] || ajustes[chave] !== undefined){
      lista.push({ chave, nome, valor, avulsa:false, dia: contasData.venc[chave] || "" });
    }
  }
  Object.keys(NOMES_FIXOS).forEach(k=> entra("fixo:"+k, NOMES_FIXOS[k], parseFloat(custosFixos[k]) || 0));
  custosFixosExtras.forEach(it=> entra("extra:"+it.nome, it.nome, parseFloat(it.valor) || 0));
  avulsas.forEach(a=> lista.push({ chave:"av:"+a.id, nome:a.nome, valor:parseFloat(a.valor)||0, avulsa:true, id:a.id, dia:a.dia || "" }));
  lista.forEach(c=>{ c.pago = pagos[c.chave] || null; });
  return lista;
}
function valorPagoConta(c){ return c.pago ? (parseFloat(c.pago.valor) || c.valor) : 0; }
function somaPendentes(lista){ return lista.filter(c=>!c.pago).reduce((s,c)=>s+c.valor, 0); }

// o número que importa: saldo do caixa menos tudo que ainda vai ter que pagar
function resumoContas(){
  const mes = mesAtual();
  const pend = somaPendentes(contasDoMes(mes));
  const ant = somaMes(mes, -1);
  const pendAnt = contasData.meses[ant] ? somaPendentes(contasDoMes(ant)) : 0;   // só se o mês passado foi acompanhado
  const saldo = saldoCaixa();
  return { saldo, pend, pendAnt, livre: saldo - pend - pendAnt };
}

function statusConta(c, mes){
  if (c.pago) return { txt:"Paga", tipo:"ok" };
  const dia = parseInt(c.dia, 10);
  const atual = mesAtual();
  if (mes < atual) return { txt:"Em aberto", tipo:"atraso" };
  if (mes === atual && dia){
    const hoje = new Date().getDate();
    if (dia < hoje) return { txt:`Atrasada · dia ${dia}`, tipo:"atraso" };
    if (dia === hoje) return { txt:"Vence hoje", tipo:"hoje" };
    return { txt:`Vence dia ${dia}`, tipo:"pend" };
  }
  return { txt: dia ? `Vence dia ${dia}` : "Pendente", tipo:"pend" };
}

function pagarConta(mes, c, descontarDoCaixa){
  const r = registroMes(mes);
  const dataISO = hojeISO();
  let caixaId = null;
  if (descontarDoCaixa && c.valor > 0){
    caixaId = Date.now() + Math.random();
    historicoCaixa.push({
      id: caixaId, data: isoParaBR(dataISO), dataISO,
      tipo:"saida", categoria:"conta", valor:c.valor,
      descricao:`Conta: ${c.nome} (${mes})`, contaChave:c.chave, contaMes:mes
    });
    saveCaixa(historicoCaixa);
  }
  r.pagos[c.chave] = { valor:c.valor, dataISO, caixaId };
  saveContas(contasData);
}
function desfazerConta(mes, c){
  const r = registroMes(mes);
  const pg = r.pagos[c.chave];
  if (pg && pg.caixaId){
    historicoCaixa = historicoCaixa.filter(x=>x.id !== pg.caixaId);
    saveCaixa(historicoCaixa);
  }
  delete r.pagos[c.chave];
  saveContas(contasData);
}
// </contas-logica>

    </div>
    ${!ehAtual ? `<div style="text-align:center; margin:-0.4rem 0 0.8rem;"><button class="btn-sec" id="contas-hoje" type="button">Voltar para o mês atual</button></div>` : ""}

    <div class="recipe" style="${ehAtual && rc.livre < 0 ? "border-color:var(--wine);" : ""}">
      <h2>${ehAtual ? "Dinheiro livre" : "Resumo do mês"}</h2>

        ${ehAtual ? `

        <div><span class="label">Dinheiro livre</span><span class="value" style="${rc.livre<0?"color:var(--wine);":""}">R$ ${rc.livre.toFixed(2)}</span></div>
        ` : `
        <div><span class="label">Total do mês</span><span class="value">R$ ${total.toFixed(2)}</span></div>
        <div><span class="label">Pago</span><span class="value">R$ ${jaPago.toFixed(2)}</span></div>
        <div><span class="label">Em aberto</span><span class="value">R$ ${pendente.toFixed(2)}</span></div>
        `}
      </div>
      ${aviso ? `<p style="font-size:0.9rem; margin-top:0.7rem; ${avisoCor}">${aviso}</p>` : ""}
      ${ehAtual && rc.pendAnt > 0 ? `<p style="font-size:0.82rem; opacity:0.8; margin-top:0.3rem;">Inclui R$ ${rc.pendAnt.toFixed(2)} ainda em aberto de ${nomeMes(somaMes(atual,-1))}.</p>` : ""}
      ${total > 0 ? `<div class="barra"><i style="width:${pct}%"></i></div><div style="font-size:0.78rem; opacity:0.7; margin-top:0.3rem;">${pct}% das contas deste mês já pagas</div>` : ""}
    </div>

    ${ehAtual ? `
    <div class="recipe">
      <h2>Posso comprar?</h2>
      <div class="sub">Antes de gastar, veja quanto sobra para as contas do mês.</div>
      <div style="display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap;">
        <span>R$</span>
        <input id="sim-compra" class="campo-contas" type="number" step="0.01" inputmode="decimal" placeholder="valor da compra" style="width:150px;">
      </div>
      <div id="sim-res" style="font-size:0.9rem; margin-top:0.6rem; min-height:1.2em;"></div>
    </div>` : ""}

    <div class="recipe">
      <h2>Contas de ${nomeMes(mes)}</h2>
      ${lista.length ? `<div class="contas-grid">${cards}</div>` : `<p style="font-size:0.9rem; opacity:0.7;">Nenhuma conta neste mês.</p>`}
    </div>

    <div class="recipe">
      <h2>Adicionar conta avulsa</h2>
      <div class="sub">Para uma conta só deste mês (fornecedor, manutenção, parcela...). As fixas ficam em Config.</div>
      <div style="display:flex; flex-direction:column; gap:0.5rem;">
        <input id="av-nome" class="campo-contas" type="text" placeholder="nome da conta">
        <div style="display:flex; gap:0.5rem;">
          <input id="av-valor" class="campo-contas" type="number" step="0.01" inputmode="decimal" placeholder="valor (R$)" style="flex:1; min-width:0;">
          <input id="av-dia" class="campo-contas" type="number" min="1" max="31" inputmode="numeric" placeholder="vence dia" style="width:110px;">
        </div>
        <div id="av-msg" style="font-size:0.85rem; color:var(--wine);"></div>
        <button id="av-add" class="btn-pri" type="button">Adicionar conta</button>
      </div>
    </div>
  `;

  // navegação entre meses
  el.querySelector("#contas-ant").addEventListener("click", ()=>{ contasMesVisto = somaMes(mes,-1); renderContas(); });
  el.querySelector("#contas-prox").addEventListener("click", ()=>{ contasMesVisto = somaMes(mes,1); renderContas(); });
  const btnHoje = el.querySelector("#contas-hoje");
  if (btnHoje) btnHoje.addEventListener("click", ()=>{ contasMesVisto = atual; renderContas(); });

  // simulador
  const sim = el.querySelector("#sim-compra");
  if (sim) sim.addEventListener("input", ()=>{
    const v = parseFloat(sim.value);
    const out = el.querySelector("#sim-res");
    if (isNaN(v) || v <= 0){ out.textContent = ""; return; }
    const depois = rc.livre - v;
    out.style.color = depois < 0 ? "var(--wine)" : "";
    out.style.fontWeight = depois < 0 ? "600" : "400";
    out.textContent = depois < 0
      ? `Se comprar, vão faltar R$ ${(-depois).toFixed(2)} para fechar as contas do mês.`
      : `Cabe: depois da compra ainda sobram R$ ${depois.toFixed(2)} livres.`;
  });

  // cartões
  const achar = node => lista.find(c=>c.chave === node.closest(".conta-card").dataset.chave);
  el.querySelectorAll(".conta-valor").forEach(inp=> inp.addEventListener("change", ()=>{
    const c = achar(inp), r = registroMes(mes);
    if (c.avulsa){ const a = r.avulsas.find(x=>x.id === c.id); if (a) a.valor = inp.value; }
    else r.ajustes[c.chave] = inp.value;
    saveContas(contasData); renderContas();
  }));
  el.querySelectorAll(".conta-dia").forEach(inp=> inp.addEventListener("change", ()=>{
    const c = achar(inp);
    if (c.avulsa){ const a = registroMes(mes).avulsas.find(x=>x.id === c.id); if (a) a.dia = inp.value; }
    else contasData.venc[c.chave] = inp.value;
    saveContas(contasData); renderContas();
  }));
  el.querySelectorAll(".conta-pagar").forEach(btn=> btn.addEventListener("click", ()=>{
    const card = btn.closest(".conta-card");
    pagarConta(mes, achar(btn), card.querySelector(".conta-caixa").checked);
    renderContas();
  }));
  el.querySelectorAll(".conta-desfazer").forEach(btn=> btn.addEventListener("click", ()=>{
    if (!confirm("Desfazer esse pagamento? Se a saída foi lançada no Caixa, ela também some.")) return;
    desfazerConta(mes, achar(btn));
    renderContas();
  }));
  el.querySelectorAll(".conta-remover").forEach(btn=> btn.addEventListener("click", ()=>{
    const c = achar(btn);
    if (!confirm(`Remover a conta "${c.nome}"?`)) return;
    const r = registroMes(mes);
    r.avulsas = r.avulsas.filter(x=>x.id !== c.id);
    delete r.pagos[c.chave];
    saveContas(contasData); renderContas();
  }));

  // nova conta avulsa
  el.querySelector("#av-add").addEventListener("click", ()=>{
    const nome = el.querySelector("#av-nome").value.trim();
    const valor = parseFloat(el.querySelector("#av-valor").value);
    const dia = el.querySelector("#av-dia").value;
    const msg = el.querySelector("#av-msg");
    if (!nome){ msg.textContent = "Dê um nome para a conta."; return; }
    if (isNaN(valor) || valor <= 0){ msg.textContent = "Informe o valor da conta."; return; }
    registroMes(mes).avulsas.push({ id: String(Date.now()) + Math.floor(Math.random()*1000), nome, valor, dia });
    saveContas(contasData); renderContas();
  });
}

// ---- Painel ----
function renderPainel(){
  const el = document.getElementById("painel");
  const nomesSabor = {choco:"Choco Ruth", nut:"Nut Ruth", kinder:"Kinder Ruth", croc:"Croc Ruth"};
  const mAtual = mesAtual();

  // Vendas e receita do mês
  let vendidosMes = 0, receitaMes = 0, custoIngVendidosMes = 0, custoEmbMes = 0, vendasSemCusto = 0, vendasEstimadas = 0;
  historicoVendas.forEach(v=>{
    if (v.dataISO && v.dataISO.slice(0,7)===mAtual){
      if (v.tipo === "combo"){
        vendidosMes += v.itens.reduce((s,it)=>s+it.qtd,0) * v.multiplicador;
      } else {
        vendidosMes += v.qtd;
      }
      receitaMes += valorDaVenda(v);
      if (typeof v.custoIng === "number"){ custoIngVendidosMes += v.custoIng; custoEmbMes += (v.custoEmb || 0); }
      else vendasSemCusto++;
      if (v.estimado) vendasEstimadas++;
    }
  });

  // Perdas do mês (e o custo delas em R$, sabor por sabor)
  let bonsMes = 0, perdidosMes = 0, custoDesperdicioMes = 0;
  historicoProducao.forEach(f=>{
    const anoMes = (f.dataISO || f.data.split("/").reverse().join("-")).slice(0,7);
    if (anoMes === mAtual){
      bonsMes += f.bons; perdidosMes += f.perdidos;
      if (f.perdidos > 0){
        const s = sabores.find(x=>x.id===f.sabor);
        const custo = s ? custoSemEmbalagemDoSabor(s) : null;   // queimado não gastou embalagem
        if (custo !== null) custoDesperdicioMes += custo * f.perdidos;
      }
    }
  });
  const totalProduzidoMes = bonsMes + perdidosMes;
  const pctPerda = totalProduzidoMes>0 ? (perdidosMes/totalProduzidoMes*100) : null;

  // Custos fixos e margem
  const totalFixo = totalCustosFixos();
  const margens = sabores.map(s=>{
    const custo = custoPorCookieDoSabor(s);
    const preco = parseFloat(precosVenda[s.id]);
    return (custo!==null && !isNaN(preco)) ? preco-custo : null;
  }).filter(m=>m!==null);
  const margemMedia = margens.length ? margens.reduce((a,b)=>a+b,0)/margens.length : null;
  const pontoEquilibrio = margemMedia && margemMedia>0 ? Math.ceil(totalFixo/margemMedia) : null;
  const lucroRealMes = receitaMes - custoIngVendidosMes - custoEmbMes - custoDesperdicioMes - totalFixo;   // receita - custo do que vendeu - queimados - contas fixas

  // Estoque: por sabor, quanto dá pra fazer + gargalo
  const dadosSabor = sabores.map(s=>{
    const { minCookies, gargalo, estoqueVazio, receitaIncompleta } = calcularDaPraFazer(s);
    return {nome: nomesSabor[s.id], minCookies, gargalo, estoqueVazio, receitaIncompleta, limitado: minCookies < RENDIMENTO_FORNADA};
  });
  const { minCookies: totalDaPraFazer, algumCadastrado: algumEstoqueCadastrado } = calcularCapacidadeTotalMassa();

  let textoEstoqueResumo = "Estoque ainda não cadastrado.";
  if (algumEstoqueCadastrado){
    const partes = [];
    dadosSabor.filter(d=>d.receitaIncompleta).forEach(d=> partes.push(`${d.nome}: receita incompleta`));
    dadosSabor.filter(d=>d.limitado && !d.estoqueVazio && !d.receitaIncompleta).forEach(d=>{
      partes.push(d.minCookies===0 ? `${d.nome}: zerado (falta ${d.gargalo})` : `${d.nome}: só ${d.minCookies} (limitado por ${d.gargalo})`);
    });
    textoEstoqueResumo = partes.length ? partes.join(" · ") : "Nenhum sabor limitado pelo estoque agora.";
  }

  // Preciso comprar algo? (itens negativos, zerados e sabores que não dá mais pra fazer)
  const paraComprar = new Map();
  itensEmFalta().forEach(x=> paraComprar.set(x.nome, x.tipo === "negativo" ? `${esc(x.nome)} (negativo)` : esc(x.nome)));
  if (algumEstoqueCadastrado) dadosSabor.forEach(d=>{
    if (!d.estoqueVazio && !d.receitaIncompleta && d.minCookies === 0 && d.gargalo && !paraComprar.has(d.gargalo)) paraComprar.set(d.gargalo, `${esc(d.gargalo)} (${esc(d.nome)} zerado)`);
  });
  const listaCompra = [...paraComprar.values()];

  // Outros avisos (o que não é compra)
  let acoes = [];
  if (!algumEstoqueCadastrado) acoes.push(`Estoque ainda não foi cadastrado: preencha em Estoque para o app saber o que falta`);
  if (pctPerda!==null && pctPerda > 10) acoes.push(`Perda do mês em ${pctPerda.toFixed(0)}% (R$ ${custoDesperdicioMes.toFixed(2)} em ingrediente perdido): vale olhar o forno ou a receita`);
  if (sabores.some(s=>isNaN(parseFloat(precosVenda[s.id])))) acoes.push(`Tem sabor sem preço de venda definido: confira em Config`);
  if (custoPorCookieDoSabor(sabores.find(s=>s.id==="kinder")) === null) acoes.push(`Recheio do Kinder Ruth ainda não tem gramatura/preço definidos`);

  // Semáforo do mês
  let status = {cor:"var(--gold)", texto:"Sem dados suficientes ainda"};
  if (pontoEquilibrio !== null){
    const proporcao = pontoEquilibrio > 0 ? vendidosMes / pontoEquilibrio : 0;
    const diaDoMes = new Date().getDate();
    const diasNoMes = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
    const proporcaoEsperada = diaDoMes / diasNoMes;
    if (proporcao >= 1) status = {cor:"#3F7D4F", texto:"Mês indo bem — meta batida"};
    else if (proporcao >= proporcaoEsperada * 0.8) status = {cor:"#C79A2B", texto:"No ritmo, mas de olho"};
    else status = {cor:"var(--wine)", texto:"Abaixo do ritmo esperado pro mês"};
  }

  // As 4 perguntas do dia
  const rc = resumoContas();
  const temContas = contasDoMes(mAtual).length > 0;
  const totalAssados = sabores.reduce((t,s)=> t + saldoDe("assados", s.id), 0);
  const totalCongelados = sabores.reduce((t,s)=> t + saldoDe("congelados", s.id), 0);
  const corLucro = lucroRealMes < 0 ? "var(--wine)" : "#3F7D4F";
  const grande = "font-size:1.6rem; font-weight:700; line-height:1.2;";
  const nota = "font-size:0.85rem; opacity:0.8; margin-top:0.3rem; line-height:1.45;";
  const verTudo = (dest, txt)=> `<div style="margin-top:0.6rem;"><button class="btn-sec" type="button" onclick="irPara('${dest}')">${txt}</button></div>`;

  el.innerHTML = `
    <div class="recipe" style="display:flex; align-items:center; gap:0.7rem;">
      <div style="width:14px; height:14px; border-radius:50%; background:${status.cor}; flex-shrink:0;"></div>
      <div style="font-size:0.95rem;">${status.texto}</div>
    </div>
    <div class="recipe" style="display:flex; gap:0.6rem; flex-wrap:wrap;">
      <button id="atalho-fornada" style="flex:1; min-width:140px; border:1px solid var(--wine); background:var(--wine); color:var(--cream); border-radius:6px; padding:0.6rem; cursor:pointer; font-family:inherit;">Registrar fornada</button>
      <button id="atalho-venda" style="flex:1; min-width:140px; border:1px solid var(--wine); background:transparent; color:var(--wine); border-radius:6px; padding:0.6rem; cursor:pointer; font-family:inherit;">Registrar venda</button>
      ${atalhosExtras.map((a,i)=>`<button class="atalho-extra" data-i="${i}" style="flex:1; min-width:140px; border:1px solid var(--gold); background:transparent; color:var(--ink); border-radius:6px; padding:0.6rem; cursor:pointer; font-family:inherit;">${esc(a.nome)}</button>`).join("")}
    </div>
    ${avisoBackupPainel()}
    <div class="recipe" style="${rc.livre < 0 && temContas ? "border-color:var(--wine);" : ""}">
      <h2>Tenho dinheiro?</h2>
      <div style="${grande}${rc.saldo < 0 ? "color:var(--wine);" : ""}">${brl(rc.saldo)}</div>
      <div style="${nota}">no Caixa agora.${temContas ? (rc.livre < 0
        ? ` <span style="color:var(--wine);">Não cobre as contas pendentes: faltam ${brl(-rc.livre)}.</span>`
        : (rc.pend + rc.pendAnt === 0 ? " Todas as contas do mês estão pagas." : ` Separando as contas pendentes, sobram ${brl(rc.livre)} livres.`)) : ""}</div>
      ${verTudo("caixa", "Abrir Caixa")}
    </div>
    <div class="recipe">
      <h2>Preciso comprar algo?</h2>
      ${listaCompra.length
        ? `<div style="${grande}">${listaCompra.length} ${listaCompra.length === 1 ? "item" : "itens"}</div><div style="${nota}">${listaCompra.slice(0,4).join(", ")}${listaCompra.length > 4 ? ` e mais ${listaCompra.length - 4}` : ""}.</div>`
        : `<div style="${grande}">Nada urgente</div><div style="${nota}">Nenhum item zerado ou negativo no estoque.</div>`}
      ${verTudo("comprar", "Abrir Comprar")}
    </div>
    <div class="recipe">
      <h2>Quantos cookies prontos?</h2>
      <div style="${grande}">${totalAssados} assados</div>
      <div style="${nota}">prontos para vender. ${totalCongelados} congelados esperando forno.${algumEstoqueCadastrado ? ` Com o estoque de hoje dá para moldar até ${totalDaPraFazer} a mais.` : ""}</div>
      ${verTudo("cookies", "Ver por sabor")}
    </div>
    <div class="recipe">
      <h2>Estou tendo lucro de verdade?</h2>
      <div style="${grande} color:${corLucro};">${brl(lucroRealMes)}</div>
      <div style="${nota}">até agora neste mês, já descontando custo do que vendeu, queimados e as contas fixas do mês inteiro.</div>
      ${vendasSemCusto ? `<p style="font-size:0.82rem; color:var(--wine); margin-top:0.4rem;">${vendasSemCusto} venda(s) do mês sem custo conhecido (falta preço de algum ingrediente: registre a compra na aba Comprar). O lucro pode estar maior do que o real.</p>` : ""}
      <details style="margin-top:0.5rem;">
        <summary style="cursor:pointer; font-size:0.85rem;">Como chegou nesse número</summary>
        <div class="summary" style="margin-top:0.5rem;">
          <div><span class="label">Vendidos</span><span class="value">${vendidosMes} cookies</span></div>
          <div><span class="label">Receita</span><span class="value">${brl(receitaMes)}</span></div>
          <div><span class="label">Ingredientes dos vendidos</span><span class="value">${brl(custoIngVendidosMes)}</span></div>
          <div><span class="label">Embalagens</span><span class="value">${brl(custoEmbMes)}</span></div>
          <div><span class="label">Queimados</span><span class="value" style="${custoDesperdicioMes>0?'color:var(--wine);':''}">${brl(custoDesperdicioMes)}</span></div>
          <div><span class="label">Contas fixas do mês</span><span class="value">${brl(totalFixo)}</span></div>
        </div>
        ${vendasEstimadas ? `<p style="font-size:0.8rem; opacity:0.7; margin-top:0.4rem;">${vendasEstimadas} venda(s) antiga(s) deste mês usam o preço e o custo de hoje, porque foram feitas antes desta versão.</p>` : ""}
      </details>
      ${verTudo("preco", "Ver preço e margem")}
    </div>
    ${acoes.length ? `<div class="recipe">
      <h2>Atenção</h2>
      <ul style="margin:0.4rem 0 0; padding-left:1.2rem; font-size:0.9rem;">${acoes.map(a=>`<li style="margin-bottom:0.3rem;">${a}</li>`).join("")}</ul>
    </div>` : ""}
  `;

  document.getElementById("atalho-fornada").addEventListener("click", ()=> irPara("producao"));
  document.getElementById("atalho-venda").addEventListener("click", ()=> irPara("vendas"));
  el.querySelectorAll(".atalho-extra").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const a = atalhosExtras[parseInt(btn.dataset.i)];
      irPara((a.foco === "nota" && a.destino === "estoque") ? "comprar" : a.destino);   // a leitura de nota agora fica na aba Comprar
      if (a.foco === "nota"){
        setTimeout(()=>{
          const card = document.getElementById("nota-card");
          if (card){ card.scrollIntoView({behavior:"smooth"}); }
        }, 50);
      }
    });
  });
}

// ---- Sincronização com armazenamento persistente (db) ----
// O localStorage sozinho pode ser apagado pelo navegador (principalmente dentro
// de app embutido). Quando o db está disponível, ele vira a fonte de verdade,
// guardada do lado do Claude, e o localStorage fica só como cache rápido.
function estadoCompleto(){
  return {
    precos, estoque, recheioGramas, precosVenda, custosFixos, custosFixosExtras,
    atalhosExtras, itensExtras, historicoProducao, historicoVendas, historicoCaixa,
    tema: loadTheme(), rendimentoFornada: RENDIMENTO_FORNADA, combos,
    metaProducaoMensal, baseHistorica, sidebarPrefs, contasData,
    historicoMoldados, saldoCookies, historicoCompras
  };
}

function marcarAlterado(){
  if (!dbRef) return;
  if (nuvemPronta) mostrarStatus("salvando");
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncToDb, 800);
}

async function syncToDb(){
  if (!dbRef || !nuvemPronta) return;   // nunca grava por cima da nuvem antes de ler o que está lá
  try{
    await dbRef.doc("estado/casaruth").set(estadoCompleto());
    ultimoSyncOk = true; clearTimeout(retryTimer); mostrarStatus("ok");
  }catch(e){
    ultimoSyncOk = false; mostrarStatus("erro", e);
    clearTimeout(retryTimer); retryTimer = setTimeout(syncToDb, 15000);   // tenta de novo sozinho
  }
}

async function carregarDoBanco(){
  try{
    dbRef = criarDbRef();
    if (!dbRef) return;
    mostrarStatus("salvando");
    const snap = await dbRef.doc("estado/casaruth").get();
    if (snap.exists && Object.keys(snap.data() || {}).length > 0){
      const d = snap.data() || {};
      if (d.precos) precos = d.precos;
      if (d.estoque) estoque = d.estoque;
      if (d.recheioGramas) recheioGramas = d.recheioGramas;
      if (d.precosVenda) precosVenda = d.precosVenda;
      if (d.custosFixos) custosFixos = d.custosFixos;
      if (d.custosFixosExtras) custosFixosExtras = d.custosFixosExtras;
      if (d.atalhosExtras) atalhosExtras = d.atalhosExtras;
      if (d.itensExtras) itensExtras = d.itensExtras;
      if (d.historicoProducao) historicoProducao = d.historicoProducao;
      if (d.historicoVendas) historicoVendas = d.historicoVendas;
      if (d.historicoCaixa) historicoCaixa = d.historicoCaixa;
      if (d.historicoMoldados) historicoMoldados = d.historicoMoldados;
      if (d.historicoCompras) { historicoCompras = d.historicoCompras; saveCompras(historicoCompras); }
      if (d.saldoCookies) saldoCookies = normalizarSaldoCookies(d.saldoCookies);
      if (d.tema) applyTheme(d.tema);
      if (d.rendimentoFornada > 0){ RENDIMENTO_FORNADA = d.rendimentoFornada; saveRendimento(RENDIMENTO_FORNADA); }
      if (d.combos) { combos = d.combos; saveCombos(combos); }
      if (d.contasData) { contasData = { meses: d.contasData.meses || {}, venc: d.contasData.venc || {} }; saveContas(contasData); }
      if (d.metaProducaoMensal) { metaProducaoMensal = d.metaProducaoMensal; saveMetaProducao(metaProducaoMensal); }
      if (d.baseHistorica) { baseHistorica = d.baseHistorica; saveBaseHistorica(baseHistorica); }
      if (d.sidebarPrefs) {
        sidebarPrefs = d.sidebarPrefs;
        if (!sidebarPrefs.pos) sidebarPrefs.pos = sidebarPrefs.side || "bottom";
        saveSidebarPrefs(sidebarPrefs);
        aplicarSidebar();
      }
      congelarVendasAntigas();
      // guarda uma cópia local também, e atualiza a tela com o que veio do banco
      saveStock(estoque); saveRecheioGramas(recheioGramas); savePrecosVenda(precosVenda);
      saveFixos(custosFixos); saveFixosExtras(custosFixosExtras); saveAtalhos(atalhosExtras);
      saveExtras(itensExtras); saveProducao(historicoProducao); saveVendas(historicoVendas);
      saveCaixa(historicoCaixa); savePrecos(precos);
      saveMoldados(historicoMoldados); saveSaldoCookies(saldoCookies);
      nuvemPronta = true; ultimoSyncOk = true; mostrarStatus("ok");
      const abaAtiva = abaAtual || "painel";
      irPara(abaAtiva);
    } else {
      await dbRef.doc("estado/casaruth").set(estadoCompleto());
      nuvemPronta = true; ultimoSyncOk = true; mostrarStatus("ok");
    }
  }catch(e){
    if (!nuvemPronta){ ultimoSyncOk = false; mostrarStatus("erro", e); }
    else { console.error(e); }
  }
}

// ---- Dock flutuante: posição (bottom/left/right), recolhido/expandido, arrastável ----
const SIDEBAR_KEY = "casaruth_sidebar";
function loadSidebarPrefs(){
  try{
    const raw = localStorage.getItem(SIDEBAR_KEY);
    if (raw === null) return { pos: window.innerWidth >= 900 ? "left" : "bottom", expanded: window.innerWidth >= 900 };
    return JSON.parse(raw);
  }catch(e){ return { pos:"bottom", expanded:false }; }
}
function saveSidebarPrefs(p){ try{ localStorage.setItem(SIDEBAR_KEY, JSON.stringify(p)); }catch(e){} marcarAlterado(); }
let sidebarPrefs = loadSidebarPrefs();
if (!sidebarPrefs.pos) sidebarPrefs.pos = sidebarPrefs.side || "bottom"; // compatibilidade com versão antiga

function posicionarLivre(sb, left, top){
  const r = sb.getBoundingClientRect();
  const m = 8;
  const maxL = Math.max(m, window.innerWidth - r.width - m);
  const maxT = Math.max(m, window.innerHeight - r.height - m);
  left = Math.min(Math.max(m, left), maxL);
  top  = Math.min(Math.max(m, top), maxT);
  sb.style.setProperty("--dx", left + "px");
  sb.style.setProperty("--dy", top + "px");
  return { left, top };
}

function aplicarSidebar(){
  const sb = document.getElementById("sidebar");
  if (!sb) return;
  sb.classList.remove("pos-bottom","pos-left","pos-right","pos-top");
  sb.classList.add("pos-"+sidebarPrefs.pos);
  sb.classList.toggle("expanded", !!sidebarPrefs.expanded);
  const livre = !!sidebarPrefs.free && typeof sidebarPrefs.fx === "number" && typeof sidebarPrefs.fy === "number";
  sb.classList.toggle("free", livre);
  if (livre) posicionarLivre(sb, sidebarPrefs.fx * window.innerWidth, sidebarPrefs.fy * window.innerHeight);
}

// ciclo de posições (toque rápido no ✥): topo -> direita -> embaixo -> esquerda -> topo...
const CICLO_POSICOES = ["top", "right", "bottom", "left"];
function proximaPosicao(atual){
  const i = CICLO_POSICOES.indexOf(atual);
  return CICLO_POSICOES[(i<0?0:i+1) % CICLO_POSICOES.length];
}

function initSidebar(){
  aplicarSidebar();
  const sb = document.getElementById("sidebar");
  const toggle = document.getElementById("sidebar-toggle");
  if (toggle) toggle.addEventListener("click", ()=>{
    sidebarPrefs.expanded = !sidebarPrefs.expanded;
    saveSidebarPrefs(sidebarPrefs);
    aplicarSidebar();
  });

  const handle = document.getElementById("sidebar-handle");
  if (handle && sb){
    let drag = null;

    handle.addEventListener("pointerdown", e=>{
      if (e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();
      const r = sb.getBoundingClientRect();
      drag = {
        id: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false,
        // onde o dedo/mouse segura o Dock (o ✥ fica no canto de cima/esquerda nas duas orientações)
        ox: Math.min(Math.max(e.clientX - r.left, 14), 36),
        oy: Math.min(Math.max(e.clientY - r.top, 14), 36)
      };
      try{ handle.setPointerCapture(e.pointerId); }catch(_){}
    });

    handle.addEventListener("pointermove", e=>{
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.moved){
        if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 6) return;   // ainda é só um toque
        drag.moved = true;
        sb.classList.add("free","dragging");
      }
      // a orientação muda sozinha conforme a região da tela: bordas = vertical, meio = horizontal
      const W = window.innerWidth, H = window.innerHeight;
      let pos;
      if (e.clientX < W * 0.18) pos = "left";
      else if (e.clientX > W * 0.82) pos = "right";
      else pos = e.clientY < H / 2 ? "top" : "bottom";
      if (pos !== sidebarPrefs.pos){
        sidebarPrefs.pos = pos;
        sb.classList.remove("pos-bottom","pos-left","pos-right","pos-top");
        sb.classList.add("pos-"+pos);
      }
      posicionarLivre(sb, e.clientX - drag.ox, e.clientY - drag.oy);
    });

    function soltar(e){
      if (!drag || e.pointerId !== drag.id) return;
      try{ handle.releasePointerCapture(e.pointerId); }catch(_){}
      const foiArrasto = drag.moved;
      drag = null;
      sb.classList.remove("dragging");
      if (foiArrasto){
        const r = sb.getBoundingClientRect();
        sidebarPrefs.free = true;
        sidebarPrefs.fx = r.left / window.innerWidth;
        sidebarPrefs.fy = r.top / window.innerHeight;
      } else {
        // toque simples: volta para o modo de encaixe e troca de lado
        sidebarPrefs.free = false;
        sidebarPrefs.pos = proximaPosicao(sidebarPrefs.pos);
      }
      saveSidebarPrefs(sidebarPrefs);
      aplicarSidebar();
    }
    handle.addEventListener("pointerup", soltar);
    handle.addEventListener("pointercancel", soltar);
  }

  window.addEventListener("resize", aplicarSidebar);
}

// ---- Cartões: transforma cada linha de tabela em um cartão (rótulos vêm do cabeçalho) ----
function cartoesDeTabelas(root){
  if (!root) return;
  root.querySelectorAll("table").forEach(t=>{
    const heads = [...t.querySelectorAll("thead th")].map(th=>th.textContent.trim());
    t.querySelectorAll("tbody tr").forEach(tr=>{
      if (tr.dataset.card) return;
      tr.dataset.card = "1";
      const tds = [...tr.children].filter(c=>c.tagName === "TD");
      tr.dataset.cols = String(tds.length);
      if (tds.length === 1 && tds[0].hasAttribute("colspan")) tr.classList.add("vazio");
      tds.forEach((td, i)=>{
        const cv = document.createElement("span");
        cv.className = "cv";
        while (td.firstChild) cv.appendChild(td.firstChild);   // move os nós: os eventos continuam valendo
        td.appendChild(cv);
        const rotulo = heads[i];
        if (i > 0 && rotulo) td.dataset.label = rotulo;
        if (i > 0 && !rotulo && cv.querySelector("button") && !cv.querySelector("input,select")) td.classList.add("acao");
      });
    });
  });
}
(function(){
  const main = document.querySelector("main");
  if (!main) return;
  new MutationObserver(()=> cartoesDeTabelas(main)).observe(main, { childList:true, subtree:true });
  cartoesDeTabelas(main);
})();

function detalheErro(e){
  if (!e) return "erro desconhecido";
  const partes = [e.message, e.code ? "código " + e.code : "", e.details || "", e.hint || ""].filter(Boolean);
  let txt = partes.join(" — ") || String(e);
  if (e.code === "42501" || /permission denied/i.test(e.message || ""))
    txt += "\n\nProvável causa: a tabela do banco ainda não foi liberada para usuários logados (falta rodar o GRANT no Supabase).";
  return txt;
}

  }
}

function traduzErro(e){
  const m = ((e && e.message) || "").toLowerCase();
  if (m.includes("invalid login")) return "Usuário ou senha incorretos.";
  if (m.includes("email not confirmed")) return "Confirme seu e-mail (veja a caixa de entrada e o spam) antes de entrar.";
  if (m.includes("already registered") || m.includes("already been registered")) return "Esse e-mail já tem conta.";
  if (m.includes("database error")) return "Esse nome de usuário já está em uso. Escolha outro.";
  if (m.includes("signups not allowed") || m.includes("signup is disabled") || m.includes("signups are disabled")) return "Novos cadastros estão desativados.";
  if (m.includes("rate limit") || m.includes("too many") || m.includes("security purposes")) return "Muitas tentativas. Aguarde alguns minutos e tente de novo.";
  if (m.includes("at least")) return "A senha precisa ter pelo menos 6 caracteres.";
  if (m.includes("same password")) return "A nova senha precisa ser diferente da anterior.";
  if (m.includes("failed to fetch") || m.includes("network")) return "Sem conexão com a internet. Tente de novo.";
  return "Não foi possível concluir. Tente de novo.";
}

async function resolverEmail(v){
  v = (v || "").trim();
  if (!v) return null;
  if (v.includes("@")) return v;
  const { data, error } = await sb.rpc("email_por_usuario", { p_usuario: v.toLowerCase() });
  if (error) throw error;
  return data || null;
}

function limparLocal(){
  const ks = [];
  for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && k.startsWith("casaruth_")) ks.push(k); }
  ks.forEach(k=> localStorage.removeItem(k));
}

async function entrou(user){
  sbUser = user;
  $a("auth").classList.remove("on");
  $a("btn-sair").style.display = "block";
  await carregarDoBanco();
}

async function enviarForm(ev){
  ev.preventDefault();
  const botao = $a("auth-go"); botao.disabled = true; setMsg("");
  try{
    const usuario = $a("f-usuario").value, email = $a("f-email").value.trim();
    const senha = $a("f-senha").value, senha2 = $a("f-senha2").value;

    if (authModo === "entrar"){
      if (!usuario.trim() || !senha) throw { message:"__campos" };
      const em = await resolverEmail(usuario);
      if (!em) throw { message:"invalid login" };
      const { data, error } = await sb.auth.signInWithPassword({ email: em, password: senha });
      if (error) throw error;
      $a("f-senha").value = "";
      await entrou(data.user);

    } else if (authModo === "criar"){
      const u = usuario.trim().toLowerCase();
      if (!/^[a-z0-9_.]{3,20}$/.test(u)) return setMsg("Usuário: 3 a 20 caracteres, só letras minúsculas, números, _ ou .", true);
      if (!email.includes("@")) return setMsg("Informe um e-mail válido (ele serve para recuperar a senha).", true);
      if (senha.length < 6) return setMsg("A senha precisa ter pelo menos 6 caracteres.", true);
      if (senha !== senha2) return setMsg("As senhas não conferem.", true);
      const { data, error } = await sb.auth.signUp({
        email, password: senha,
        options: { data: { username: u }, emailRedirectTo: location.origin + location.pathname }
      });
      if (error) throw error;
      if (data.session) await entrou(data.session.user);
      else { setModo("entrar"); setMsg("Conta criada! Enviamos um e-mail de confirmação. Clique no link e depois entre."); }

    } else if (authModo === "esqueci"){
      if (!usuario.trim()) return setMsg("Informe seu usuário ou e-mail.", true);
      const em = await resolverEmail(usuario);
      if (em){
        const { error } = await sb.auth.resetPasswordForEmail(em, { redirectTo: location.origin + location.pathname });
        if (error) throw error;
      }
      setMsg("Se essa conta existir, enviamos um link para criar uma nova senha. Veja também o spam.");

    } else if (authModo === "nova"){
      if (senha.length < 6) return setMsg("A senha precisa ter pelo menos 6 caracteres.", true);
      if (senha !== senha2) return setMsg("As senhas não conferem.", true);
      const { error } = await sb.auth.updateUser({ password: senha });
      if (error) throw error;
      history.replaceState(null, "", location.pathname);
      emRecuperacao = false;
      const { data } = await sb.auth.getUser();
      await entrou(data.user);
    }
  }catch(e){
    setMsg(e && e.message === "__campos" ? "Preencha usuário e senha." : traduzErro(e), true);
  }finally{
    botao.disabled = false;
  }
}

async function sair(){
  try{ clearTimeout(syncTimer); await syncToDb(); }catch(e){}
  const tudoSalvo = nuvemPronta && ultimoSyncOk;
  if (!tudoSalvo){
    if (!confirm("Atenção: seus dados mais recentes NÃO foram salvos na nuvem. Se você sair, eles podem se perder. Quer sair mesmo assim?")) return;
  }
  try{ await sb.auth.signOut(); }catch(e){}
  if (tudoSalvo) limparLocal();   // só apaga a cópia deste aparelho quando a nuvem tem tudo
  location.reload();
}

async function iniciarDb(){
  $a("auth-form").addEventListener("submit", enviarForm);

  $a("sync-status").addEventListener("click", ()=>{ if ($a("sync-status").classList.contains("erro")) alert("Não foi possível salvar na nuvem.\n\n" + detalheStatus); });
  window.addEventListener("online", ()=>{ if (dbRef && nuvemPronta && !ultimoSyncOk) syncToDb(); });
  document.addEventListener("visibilitychange", ()=>{
    if (document.visibilityState === "hidden" && dbRef && nuvemPronta){ clearTimeout(syncTimer); syncToDb(); }
  });
  $a("auth-esqueci").addEventListener("click", ()=> setModo("esqueci"));
  $a("auth-voltar").addEventListener("click", ()=> setModo("entrar"));
  document.querySelectorAll("#auth-tabs button").forEach(b=> b.addEventListener("click", ()=> setModo(b.dataset.modo)));

  mostrarAuth(); setModo("entrar");
  if (!window.supabase || SUPABASE_URL.startsWith("COLE_AQUI")){
    setMsg("Falta configurar o Supabase: cole a URL e a chave anon no início do script (veja o LEIA-ME).", true);
    return;
  }
  emRecuperacao = /type=recovery/.test(location.hash);
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  sb.auth.onAuthStateChange((evento)=>{
    if (evento === "PASSWORD_RECOVERY"){ emRecuperacao = true; mostrarAuth(); setModo("nova"); }
  });
  const { data } = await sb.auth.getSession();
  if (emRecuperacao){ mostrarAuth(); setModo("nova"); return; }
  if (data.session) await entrou(data.session.user);
}
